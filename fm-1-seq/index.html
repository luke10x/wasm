        }, 520);
        if (addStepBtn && e.pointerId !== undefined) addStepBtn.setPointerCapture(e.pointerId);
      }

      function handleAddButtonPointerUp(e) {
        clearTimeout(addButtonLongPressTimer);
        if (addStepBtn && e.pointerId !== undefined && addStepBtn.hasPointerCapture(e.pointerId)) {
          addStepBtn.releasePointerCapture(e.pointerId);
        }
        if (addButtonLongPressFired) {
          addButtonLongPressFired = false;
          return;
        }
        if (autoAddEnabled) {
          clearTimeout(autoAddTimer);
          autoAddTimer = null;
          autoAddEnabled = false;
          flashDuration('Auto Add Off');
          updateComposerUI();
          return;
        }
        commitCursorStep();
      }

      function handleAddButtonPointerCancel(e) {
        clearTimeout(addButtonLongPressTimer);
        addButtonLongPressFired = false;
        if (addStepBtn && e.pointerId !== undefined && addStepBtn.hasPointerCapture(e.pointerId)) {
          addStepBtn.releasePointerCapture(e.pointerId);
        }
      }

      function handlePlayButtonPointerDown(e) {
        playButtonLongPressFired = false;
        clearTimeout(playButtonLongPressTimer);
        if (transportMode !== 'playing') {
          playButtonLongPressTimer = setTimeout(() => {
            playButtonLongPressFired = true;
            if (startPlayback({ loop: true })) flashDuration('Loop');
          }, 520);
        }
        if (playPatternBtn && e.pointerId !== undefined) playPatternBtn.setPointerCapture(e.pointerId);
      }

      function handlePlayButtonPointerUp(e) {
        clearTimeout(playButtonLongPressTimer);
        if (playPatternBtn && e.pointerId !== undefined && playPatternBtn.hasPointerCapture(e.pointerId)) {
          playPatternBtn.releasePointerCapture(e.pointerId);
        }
        if (playButtonLongPressFired) {
          playButtonLongPressFired = false;
          return;
        }
        if (transportMode === 'playing') {
          stopPlayback();
        } else {
          startPlayback();
        }
      }

      function handlePlayButtonPointerCancel(e) {
        clearTimeout(playButtonLongPressTimer);
        playButtonLongPressFired = false;
        if (playPatternBtn && e.pointerId !== undefined && playPatternBtn.hasPointerCapture(e.pointerId)) {
          playPatternBtn.releasePointerCapture(e.pointerId);
        }
      }

      function resetPlaybackEventFlags() {
        sequence.forEach((ev) => { ev.onFired = false; ev.offFired = false; });
      }

      function silencePlaybackEvents() {
        sequence.forEach((ev) => {
          if (ev.onFired && !ev.offFired) {
            ev.notes.forEach((n) => noteOff(n, 'playback'));
            ev.offFired = true;
          }
        });
      }

      function startPlayback(options={}) {
        if (recordCursorBar <= 0) {
          flashDuration('Empty');
          return false;
        }
        allNotesOff();
        loopPlaybackEnabled = !!options.loop;
        transportMode = 'playing';
        playheadBar = 0;
        playStartPerf = performance.now();
        resetPlaybackEventFlags();
        updateTransportStatus();
        pushBackgroundToBar(0);
        setBackgroundPlaybackSpeed();
        return true;
      }

      function stopPlayback() {
        clearTimeout(playButtonLongPressTimer);
        transportMode = 'stopped';
        loopPlaybackEnabled = false;
        silencePlaybackEvents();
        updateTransportStatus();
        stopBackgroundMotion();
      }

      function tickPlayback() {
        const elapsedSec = (performance.now() - playStartPerf) / 1000;
        const barsPerSec = getBarsPerSecond();
        playheadBar = elapsedSec * barsPerSec;

        sequence.forEach((ev) => {
          if (!ev.onFired && playheadBar >= ev.startBar) {
            ev.onFired = true;
            ev.notes.forEach((n) => noteOn(n, 100, 'playback'));
          }
          if (ev.onFired && !ev.offFired && playheadBar >= ev.startBar + ev.durBar) {
            ev.offFired = true;
            ev.notes.forEach((n) => noteOff(n, 'playback'));
          }
        });

        if (playheadBar > recordCursorBar + 0.001 && loopPlaybackEnabled) {
          silencePlaybackEvents();
          resetPlaybackEventFlags();
          playheadBar = 0;
          playStartPerf = performance.now();
          pushBackgroundToBar(0);
          updateTransportStatus();
          return;
        }

        if (playheadBar > recordCursorBar + 0.001) {
          stopPlayback();
        }
      }

      function loadPatternMap() {
        try {
          const parsed = JSON.parse(localStorage.getItem(PATTERN_STORAGE_KEY) || '{}');
          return parsed && typeof parsed === 'object' ? parsed : {};
        } catch (e) {
          return {};
        }
      }

      function savePatternMap(patterns) {
        localStorage.setItem(PATTERN_STORAGE_KEY, JSON.stringify(patterns));
      }

      function saveCurrentPattern() {
        const rawName = patternNameInput ? patternNameInput.value.trim() : '';
        const name = rawName || `Pattern ${new Date().toLocaleTimeString()}`;
        const patterns = loadPatternMap();
        patterns[name] = { steps, bpm };
        savePatternMap(patterns);
        if (patternNameInput) patternNameInput.value = name;
        updateSavedPatternSelect();
        if (patternSelect) patternSelect.value = name;
        flashDuration('Saved');
      }

      function loadSelectedPattern() {
        if (!patternSelect || !patternSelect.value) return;
        const patterns = loadPatternMap();
        const pattern = patterns[patternSelect.value];
        if (!pattern || !Array.isArray(pattern.steps)) return;
        if (transportMode === 'playing') stopPlayback();
        let t = 0;
        steps = pattern.steps.map((step) => {
          const durBar = Number(step.durBar) || DURATIONS[DEFAULT_DURATION_INDEX].bars;
          const hasStartBar = Number.isFinite(step.startBar);
          const startBar = hasStartBar ? Number(step.startBar) : t;
          t = hasStartBar ? Math.max(t, startBar + durBar) : t + durBar;
          return {
            startBar,
            durBar,
            label: step.label || durationLabelForBars(durBar),
            notes: Array.isArray(step.notes) ? step.notes.map((n) => parseInt(n, 10)).filter(Number.isFinite) : [],
          };
        });
        if (Number.isFinite(pattern.bpm) && bpmInput) {
          bpm = pattern.bpm;
          bpmInput.value = String(Math.round(bpm));
        }
        if (patternNameInput) patternNameInput.value = patternSelect.value;
        rebuildSequence();
        pushBackgroundToBar(recordCursorBar);
        cursorBar = recordCursorBar;
        updateComposerUI();
      }

      function initComposerControls() {
        if (durationButtonsEl) {
          durationButtonsEl.innerHTML = '';
          getDurationButtonGroups().forEach((group) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.dataset.durationIndexes = group.indexes.join(',');
            group.labels.forEach((label, labelIdx) => {
              const span = document.createElement('span');
              span.textContent = label;
              if (labelIdx > 0) span.className = 'duration-alt';
              btn.appendChild(span);
            });
            btn.addEventListener('click', () => {
              selectedDurationIndex = group.indexes[0];
              updateComposerUI();
              flashDuration(group.labels.join(' / '));
            });
            durationButtonsEl.appendChild(btn);
          });
        }
        if (playPatternBtn) {
          playPatternBtn.addEventListener('pointerdown', handlePlayButtonPointerDown);
          playPatternBtn.addEventListener('pointerup', handlePlayButtonPointerUp);
          playPatternBtn.addEventListener('pointercancel', handlePlayButtonPointerCancel);
          playPatternBtn.addEventListener('contextmenu', (e) => e.preventDefault());
        }
        if (cursorBackBtn) cursorBackBtn.addEventListener('click', () => moveCursor(-1));
        if (cursorForwardBtn) cursorForwardBtn.addEventListener('click', () => moveCursor(1));
        if (editModeBtn) editModeBtn.addEventListener('click', toggleEditMode);
        if (addStepBtn) {
          addStepBtn.addEventListener('pointerdown', handleAddButtonPointerDown);
          addStepBtn.addEventListener('pointerup', handleAddButtonPointerUp);
          addStepBtn.addEventListener('pointercancel', handleAddButtonPointerCancel);
          addStepBtn.addEventListener('contextmenu', (e) => e.preventDefault());
        }
        if (restStepBtn) restStepBtn.addEventListener('click', clearSelectedRange);
        if (undoStepBtn) undoStepBtn.addEventListener('click', undoStep);
        if (clearPatternBtn) clearPatternBtn.addEventListener('click', clearPattern);
        if (savePatternBtn) savePatternBtn.addEventListener('click', saveCurrentPattern);
        if (loadPatternBtn) loadPatternBtn.addEventListener('click', loadSelectedPattern);
        if (patternSelect) patternSelect.addEventListener('change', () => {
          if (patternSelect.value && patternNameInput) patternNameInput.value = patternSelect.value;
        });
        updateSavedPatternSelect();
        updateComposerUI();
      }

      function drawTracker() {
        const cssW = trackerCanvas._cssW || trackerCanvas.clientWidth;
        const cssH = trackerCanvas._cssH || trackerCanvas.clientHeight;
        const dpr = window.devicePixelRatio || 1;
        trackerCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        trackerCtx.clearRect(0, 0, cssW, cssH);

        // Translucent wash so the 3D sun behind is still visible through it.
        trackerCtx.fillStyle = 'rgba(6,4,16,0.42)';
        trackerCtx.fillRect(0, 0, cssW, cssH);

        const playing = transportMode === 'playing';
        const dockRect = bottomDockEl.getBoundingClientRect();
        const playheadY = dockRect.top;
        const previewDur = getSelectedDuration().bars;
        const visibleBars = Math.max(0.25, playheadY / pxPerBar);
        const composeViewBar = Math.max(0, cursorBar + previewDur - visibleBars * 0.82);
        const now = playing ? playheadBar : composeViewBar;
        const barToY = (t) => playheadY - (t - now) * pxPerBar;

        const loT = now - visibleBars - 0.5;
        const hiT = now + visibleBars + 0.5;
        const kStart = Math.floor(loT * 16) - 1;
        const kEnd = Math.ceil(hiT * 16) + 1;
        for (let k = kStart; k <= kEnd; k++) {
          const t = k / 16;
          const y = barToY(t);
          if (y < -4 || y > cssH + 4) continue;
          const isBarLine = (k % 16 === 0);
          trackerCtx.strokeStyle = isBarLine ? 'rgba(150,180,255,0.35)' : 'rgba(120,150,220,0.08)';
          trackerCtx.lineWidth = isBarLine ? 1.5 : 1;
          trackerCtx.beginPath();
          trackerCtx.moveTo(0, y + 0.5);
          trackerCtx.lineTo(cssW, y + 0.5);
          trackerCtx.stroke();
          if (isBarLine && t >= 0) {
            trackerCtx.fillStyle = 'rgba(2,5,14,0.58)';
            trackerCtx.fillRect(5, y - 8, 24, 16);
            trackerCtx.fillStyle = 'rgba(205,225,255,0.72)';
            trackerCtx.font = '700 11px Segoe UI, system-ui, sans-serif';
            trackerCtx.textAlign = 'center';
            trackerCtx.textBaseline = 'middle';
            trackerCtx.fillText(String(Math.floor(t) + 1), 17, y);
          }
        }

        const scrollX = pianoScrollEl.scrollLeft;
        const originLeft = pianoScrollEl.getBoundingClientRect().left;
        const canvasLeft = trackerCanvas.getBoundingClientRect().left;
        const xShift = (originLeft - canvasLeft) - scrollX;

        noteColumnMap.forEach((col) => {
          const x = xShift + col.x;
          if (x < -col.width || x > cssW) return;
          trackerCtx.fillStyle = col.black ? 'rgba(50,70,102,0.13)' : 'rgba(210,230,255,0.045)';
          trackerCtx.fillRect(x, 0, Math.max(1, col.width), cssH);
        });

        if (!playing) {
          const nextStartY = barToY(cursorBar);
          const nextEndY = barToY(cursorBar + previewDur);
          const yTop = Math.min(nextStartY, nextEndY);
          const yBot = Math.max(nextStartY, nextEndY);
          const cursorFill = editMode === 'add' ? 'rgba(116,210,184,0.16)' : 'rgba(255,145,92,0.13)';
          const cursorStroke = editMode === 'add' ? 'rgba(170,255,220,0.82)' : 'rgba(255,190,120,0.75)';
          trackerCtx.fillStyle = cursorFill;
          trackerCtx.fillRect(0, yTop, cssW, Math.max(4, yBot - yTop));
          trackerCtx.strokeStyle = cursorStroke;
          trackerCtx.lineWidth = 2;
          trackerCtx.beginPath();
          trackerCtx.moveTo(0, nextStartY + 0.5);
          trackerCtx.lineTo(cssW, nextStartY + 0.5);
          trackerCtx.stroke();
        }

        // "Now" / playhead line, glued to the active edge of the keyboard dock.
        trackerCtx.strokeStyle = 'rgba(200,225,255,0.55)';
        trackerCtx.lineWidth = 1.5;
        trackerCtx.beginPath();
        trackerCtx.moveTo(0, playheadY + 0.5);
        trackerCtx.lineTo(cssW, playheadY + 0.5);
        trackerCtx.stroke();

        function drawEvent(notes, startBar, durBar, isLive, isRest, isCurrent=false, isReplaceTarget=false) {
          const yA = barToY(startBar);
          const yB = barToY(startBar + durBar);
          const yTop = Math.min(yA, yB);
          const yBot = Math.max(yA, yB);
          if (yBot < -10 || yTop > cssH + 10) return;
          if (isRest) {
            trackerCtx.fillStyle = 'rgba(255,255,255,0.055)';
            trackerCtx.fillRect(0, yTop, cssW, Math.max(2, yBot - yTop));
            return;
          }
          notes.forEach((note) => {
            const col = noteColumnMap.get(note);
            if (!col) return;
            const x = xShift + col.x + 1;
            if (x + col.width < 0 || x > cssW) return;
            const w = Math.max(2, col.width - 2);
            const blink = (isCurrent || isReplaceTarget) ? 0.5 + Math.sin(performance.now() * 0.018) * 0.5 : 0;
            trackerCtx.fillStyle = isLive
              ? 'rgba(255,120,170,0.36)'
              : (isReplaceTarget
                ? `rgba(255,235,120,${0.2 + blink * 0.55})`
              : (playing
                ? (isCurrent
                  ? `rgba(255,255,255,${0.54 + blink * 0.42})`
                  : (col.black ? 'rgba(110,220,245,0.95)' : 'rgba(255,185,116,0.95)'))
                : (col.black ? 'rgba(120,190,255,0.85)' : 'rgba(255,150,190,0.85)')));
            const h = Math.max(3, yBot - yTop);
            trackerCtx.fillRect(x, yTop, w, h);
            trackerCtx.strokeStyle = isLive
              ? 'rgba(255,235,245,0.32)'
              : (isReplaceTarget
                ? `rgba(255,255,255,${0.6 + blink * 0.4})`
                : (isCurrent ? `rgba(255,255,255,${0.82 + blink * 0.18})` : 'rgba(245,250,255,0.88)'));
            trackerCtx.lineWidth = (isCurrent || isReplaceTarget) ? 2 : 1.35;
            trackerCtx.strokeRect(x + 0.5, yTop + 0.5, Math.max(1, w - 1), Math.max(1, h - 1));
          });
        }

        let t = 0;
        steps.forEach((step) => {
          const hasStartBar = Number.isFinite(step.startBar);
          const stepStart = hasStartBar ? Number(step.startBar) : t;
          const stepEnd = stepStart + step.durBar;
          const replacingPreview = !playing && editMode !== 'add';
          const replaceStart = cursorBar;
          const replaceEnd = cursorBar + previewDur;
          const isRest = !step.notes || step.notes.length === 0;
          const isCurrent = playing && !isRest && playheadBar >= stepStart && playheadBar < stepEnd;
          if (replacingPreview && stepEnd > replaceStart && stepStart < replaceEnd) {
            if (stepStart < replaceStart) {
              drawEvent(step.notes, stepStart, replaceStart - stepStart, false, isRest, isCurrent);
            }
            const overlapStart = Math.max(stepStart, replaceStart);
            const overlapEnd = Math.min(stepEnd, replaceEnd);
            if (overlapEnd > overlapStart) {
              drawEvent(step.notes, overlapStart, overlapEnd - overlapStart, false, isRest, isCurrent, true);
            }
            if (stepEnd > replaceEnd) {
              drawEvent(step.notes, replaceEnd, stepEnd - replaceEnd, false, isRest, isCurrent);
            }
          } else {
            drawEvent(step.notes, stepStart, step.durBar, false, isRest, isCurrent);
          }
          t = hasStartBar ? Math.max(t, stepEnd) : t + step.durBar;
        });

        if (!playing && cursorNotes.length > 0) {
          drawEvent(cursorNotes, cursorBar, previewDur, true, false);
        }
      }

      function trackerLoop() {
        if (transportMode === 'playing') tickPlayback();
        updateComposerUI();
        drawTracker();
        requestAnimationFrame(trackerLoop);
      }

      let gridDrag = null;
      function endGridDrag(e) {
        if (gridDrag && e && e.pointerId === gridDrag.pointerId && trackerCanvas.hasPointerCapture(e.pointerId)) {
          trackerCanvas.releasePointerCapture(e.pointerId);
        }
        gridDrag = null;
        trackerCanvas.classList.remove('dragging');
      }
      trackerCanvas.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        userPannedKeyboard = true;
        gridDrag = {
          pointerId: e.pointerId,
          startX: e.clientX,
          scrollLeft: pianoScrollEl.scrollLeft,
        };
        trackerCanvas.classList.add('dragging');
        trackerCanvas.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      trackerCanvas.addEventListener('pointermove', (e) => {
        if (!gridDrag || e.pointerId !== gridDrag.pointerId) return;
        pianoScrollEl.scrollLeft = gridDrag.scrollLeft - (e.clientX - gridDrag.startX);
        e.preventDefault();
      });
      trackerCanvas.addEventListener('pointerup', endGridDrag);
      trackerCanvas.addEventListener('pointercancel', endGridDrag);
      pianoScrollEl.addEventListener('scroll', () => {
        if (!programmaticKeyboardScroll) userPannedKeyboard = true;
        recomputeNoteColumns();
      }, { passive: true });


      outputSelect.addEventListener('change', () => { if(!midiAccess)return; selectedOutput=midiAccess.outputs.get(outputSelect.value)||null; allNotesOff(); updateUI(); });
      inputSelect.addEventListener('change', () => {
        if(!midiAccess)return;
        if(selectedInput) selectedInput.onmidimessage=null;
        selectedInput=midiAccess.inputs.get(inputSelect.value)||null;
        if(selectedInput) { attachInputListener(selectedInput); statusBadgeIn.textContent='👂'; statusBadgeIn.title='Listening'; statusBadgeIn.setAttribute('aria-label','Listening'); statusBadgeIn.className='status-badge online'; } else { statusBadgeIn.textContent='○'; statusBadgeIn.title='Input off'; statusBadgeIn.setAttribute('aria-label','Input off'); statusBadgeIn.className='status-badge'; }
        updateUI();
      });
      showRawCheck.addEventListener('change', () => {});
      clearLogBtn.addEventListener('click', () => { logArea.value=''; });

      document.addEventListener('keydown', (e) => {
        if (e.repeat) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const key = e.key.toLowerCase();
        const tag = e.target && e.target.tagName;
        if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
        if (key in KEYBOARD_MAP) {
          e.preventDefault();
          noteOn(KEYBOARD_MAP[key], 105, 'computer');
          return;
        }
        if (e.code === 'Space') {
          e.preventDefault();
          transportMode === 'playing' ? stopPlayback() : startPlayback();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          commitCursorStep();
        } else if (e.key === 'Backspace') {
          e.preventDefault();
          undoStep();
        } else if (key === 'r') {
          e.preventDefault();
          clearSelectedRange();
        }
      });
      document.addEventListener('keyup', (e) => { if (e.ctrlKey || e.metaKey || e.altKey) return; const key=e.key.toLowerCase(); if(key in KEYBOARD_MAP) { e.preventDefault(); noteOff(KEYBOARD_MAP[key], 'computer'); } });
      document.addEventListener('visibilitychange', () => { if(document.hidden) allNotesOff(); });
      window.addEventListener('beforeunload', () => allNotesOff());

      buildPiano();
      scheduleKeyboardCenter(true);
      resizeTrackerCanvas();
      initComposerControls();
      requestAnimationFrame(trackerLoop);

      let resizeDebounce = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeDebounce);
        resizeDebounce = setTimeout(() => {
          buildPiano();          // also re-measures columns via recomputeNoteColumns()
          resizeTrackerCanvas();
        }, 150);
      });

      setTimeout(connectMIDI, 400);
    })();
  </script>
  <script>
    window.PWA_UPDATE_CONFIG = {
      serviceWorkerUrl: 'sw.js?v=1',
      updateUrl: './',
      storageKey: 'fm-1-seq-hash',
      autoCheck: true
    };
  </script>
  <script src="../pwa/update-pwa.js?v=4"></script>
</body>
</html>

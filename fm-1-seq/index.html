<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MIDI Stereo · DX7 Patch Manager</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a12; touch-action: manipulation;
    }
    #bg-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0;
      display: block; pointer-events: none;
    }

    /* TOP LEFT LOG */
    #top-left-log {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      width: 320px; max-width: calc(100vw - 40px);
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 12px; padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      pointer-events: auto;
    }
    #top-left-log .log-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap;
    }
    #top-left-log .log-header span {
      color: #b0d0f0; font-size: 0.8rem; font-weight: 600;
    }
    #top-left-log .log-header label {
      color: #8aacd8; font-size: 0.7rem; display: flex; align-items: center; gap: 4px; cursor: pointer; margin-left: auto;
    }
    #top-left-log .log-header label input { accent-color: #6a9ae0; width: 14px; height: 14px; cursor: pointer; }
    #top-left-log .log-header button {
      background: rgba(47,61,94,0.7); border: 1px solid rgba(74,96,136,0.5);
      color: #d6e6ff; padding: 2px 12px; border-radius: 14px; font-size: 0.7rem; cursor: pointer;
    }
    #top-left-log .log-header button:active { transform: scale(0.95); }
    #logArea {
      width: 100%; height: 90px; background: rgba(11,20,34,0.4); border: 1px solid rgba(26,42,68,0.5);
      border-radius: 8px; color: #b0d0f0; font-family: 'Courier New', monospace; font-size: 0.6rem;
      padding: 4px 6px; resize: none; outline: none; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: #2a4060 transparent;
    }
    #logArea::-webkit-scrollbar { width: 4px; }
    #logArea::-webkit-scrollbar-thumb { background: #2a4060; border-radius: 10px; }

    /* TOP RIGHT MIDI */
    #top-right-midi {
      position: fixed; top: 20px; right: 20px; z-index: 10;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 60px; padding: 8px 16px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      pointer-events: auto; max-width: calc(100vw - 40px);
    }
    #top-right-midi .connect-section {
      display: flex; align-items: center; gap: 4px;
    }
    #top-right-midi .connect-section label {
      font-size: 0.6rem; color: #8aacd8; font-weight: 600;
    }
    #top-right-midi .connect-section select {
      background: rgba(30,45,74,0.8); border: 1px solid rgba(61,90,128,0.6);
      color: #d6e6ff; padding: 2px 8px; border-radius: 30px; font-size: 0.7rem;
      outline: none; cursor: pointer; min-width: 70px;
      -webkit-appearance: none; appearance: none;
    }
    #top-right-midi .connect-section select:disabled { opacity: 0.4; cursor: not-allowed; }
    #top-right-midi button {
      background: #2d5a8a; border: none; color: white; padding: 3px 14px;
      border-radius: 40px; font-weight: 600; font-size: 0.75rem; cursor: pointer;
      border: 1px solid rgba(74,123,181,0.5); height: 26px;
    }
    #top-right-midi button:active { transform: scale(0.95); }
    #top-right-midi .status-badge {
      font-size: 0.55rem; padding: 2px 8px; border-radius: 30px;
      background: rgba(42,42,74,0.6); color: #8a9fc0; border: 1px solid rgba(58,74,106,0.4);
      white-space: nowrap; height: 22px; display: flex; align-items: center;
    }
    #top-right-midi .status-badge.online {
      background: rgba(26,74,58,0.6); color: #7de0b0; border-color: rgba(58,168,122,0.4);
    }

    /* BOTTOM DOCK */
    #bottom-dock {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 6px 16px 8px 16px;
      pointer-events: auto;
      display: flex; flex-direction: column; gap: 4px;
    }
    #patch-controls {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      min-height: 32px;
    }
    #patch-controls label {
      font-size: 0.65rem; color: #7a9abb; font-weight: 600; white-space: nowrap;
    }
    #patch-controls input[type="file"] {
      background: rgba(30,45,74,0.8); border: 1px solid rgba(61,90,128,0.6);
      color: #d6e6ff; padding: 2px 8px; border-radius: 30px; font-size: 0.65rem;
      cursor: pointer; max-width: 130px;
    }
    #patch-controls input[type="number"] {
      background: rgba(30,45,74,0.8); border: 1px solid rgba(61,90,128,0.6);
      color: #d6e6ff; padding: 1px 4px; border-radius: 30px; text-align: center;
      font-size: 0.7rem; outline: none; width: 40px;
      -moz-appearance: textfield;
    }
    #patch-controls input[type="number"]::-webkit-inner-spin-button,
    #patch-controls input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    #patch-controls select {
      background: rgba(30,45,74,0.8); border: 1px solid rgba(61,90,128,0.6);
      color: #d6e6ff; padding: 2px 8px; border-radius: 30px; font-size: 0.7rem;
      outline: none; cursor: pointer; min-width: 110px; max-width: 160px;
      -webkit-appearance: none; appearance: none;
    }
    #patch-controls select:disabled { opacity: 0.4; cursor: not-allowed; }
    #patch-controls button {
      background: rgba(47,61,94,0.8); border: 1px solid rgba(74,96,136,0.5);
      color: #d6e6ff; padding: 2px 12px; border-radius: 30px;
      font-weight: 600; font-size: 0.65rem; cursor: pointer;
      height: 24px; white-space: nowrap;
    }
    #patch-controls button:active { transform: scale(0.95); }
    #patch-controls button:disabled { opacity: 0.35; cursor: not-allowed; }
    #patch-controls .patch-status {
      font-size: 0.65rem; color: #7a9abb; white-space: nowrap;
    }

    /* PIANO */
    #piano-container {
      overflow-x: auto; padding: 2px 0 4px 0;
      scrollbar-width: thin; scrollbar-color: #2a4060 transparent;
    }
    #piano-container::-webkit-scrollbar { height: 4px; }
    #piano-container::-webkit-scrollbar-thumb { background: #2a4060; border-radius: 10px; }
    .piano {
      display: inline-flex; height: 100px; position: relative;
      background: rgba(0,0,0,0.2); border-radius: 6px;
    }
    .key-white {
      flex: 0 0 26px; height: 100%;
      background: rgba(240,244,254,0.85);
      border: 1px solid rgba(176,200,232,0.5);
      border-radius: 0 0 4px 4px;
      box-shadow: 0 2px 0 rgba(176,192,216,0.3);
      cursor: pointer; position: relative;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 4px; font-size: 0.45rem; font-weight: 600;
      color: rgba(0,0,0,0.3);
      transition: background 0.06s, transform 0.06s, box-shadow 0.06s;
      touch-action: none; z-index: 1;
    }
    .key-white.active {
      background: rgba(200,223,255,0.9);
      transform: translateY(2px);
      box-shadow: 0 0 0 rgba(176,192,216,0);
      border-color: rgba(106,154,224,0.8);
    }
    .key-black {
      position: absolute; top: 0; height: 65%;
      background: rgba(26,31,46,0.9);
      border: 1px solid rgba(8,11,18,0.8);
      border-radius: 0 0 3px 3px;
      box-shadow: 0 2px 0 rgba(5,7,12,0.6), 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer; pointer-events: auto; z-index: 3;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 2px; color: rgba(255,255,255,0.15);
      font-size: 0.4rem;
      transition: background 0.06s, transform 0.06s, box-shadow 0.06s;
      touch-action: none;
      width: 16px; margin: 0;
    }
    .key-black.active {
      background: rgba(58,74,106,0.9);
      transform: translateY(2px);
      box-shadow: 0 0 0 rgba(5,7,12,0.6), 0 2px 4px rgba(0,0,0,0.6);
      border-color: rgba(106,138,186,0.6);
    }
    .key-label {
      position: absolute; bottom: 2px; font-size: 0.4rem;
      pointer-events: none; color: rgba(255,255,255,0.3);
    }
    .key-white .key-label { color: rgba(0,0,0,0.25); }
    .key-black .key-label { color: rgba(255,255,255,0.25); }

    @media (max-width: 700px) {
      #top-left-log { top: 10px; left: 10px; width: 200px; padding: 6px 8px; }
      #logArea { height: 50px; font-size: 0.5rem; }
      #top-right-midi { top: 10px; right: 10px; padding: 4px 10px; gap: 6px; }
      #top-right-midi .connect-section select { min-width: 50px; font-size: 0.6rem; padding: 1px 4px; }
      #top-right-midi button { font-size: 0.6rem; padding: 1px 10px; height: 22px; }
      #bottom-dock { padding: 4px 8px 6px 8px; }
      #patch-controls { gap: 4px; min-height: 26px; }
      #patch-controls label { font-size: 0.55rem; }
      #patch-controls select { min-width: 70px; font-size: 0.6rem; padding: 1px 4px; }
      #patch-controls button { font-size: 0.55rem; padding: 1px 8px; height: 20px; }
      .key-white { flex: 0 0 18px; font-size: 0.35rem; }
      .key-black { width: 12px; font-size: 0.35rem; }
      .piano { height: 70px; }
    }
  </style>
</head>
<body>

  <!-- data-speed controls the background's forward-motion speed in real time.
       Negative values run the scene in reverse. Change it any time, e.g.:
         document.getElementById('bg-canvas').dataset.speed = -4;
       or use the helper: window.setBackgroundSpeed(-4); -->
  <canvas id="bg-canvas" data-speed="6"></canvas>

  <!-- TOP LEFT LOG -->
  <div id="top-left-log">
    <div class="log-header">
      <span>📋 MIDI Log</span>
      <button id="clearLogBtn">Clear</button>
      <label><input type="checkbox" id="showRawCheck" /> Raw</label>
    </div>
    <textarea id="logArea" readonly placeholder="MIDI messages appear here..." spellcheck="false"></textarea>
  </div>

  <!-- TOP RIGHT MIDI CONTROLS -->
  <div id="top-right-midi">
    <div class="connect-section">
      <label>🎛️ Out</label>
      <select id="midiOutputSelect" disabled><option value="">— none —</option></select>
    </div>
    <div class="connect-section">
      <label>🎤 In</label>
      <select id="midiInputSelect" disabled><option value="">— none —</option></select>
    </div>
    <button id="connectBtn">🔌 Connect</button>
    <span id="statusBadgeOut" class="status-badge">⚪ off</span>
    <span id="statusBadgeIn" class="status-badge">⚪ off</span>
  </div>

  <!-- BOTTOM DOCK -->
  <div id="bottom-dock">
    <div id="piano-container">
      <div class="piano" id="pianoContainer"></div>
    </div>
    <div id="patch-controls">
      <label>📂 Load .syx</label>
      <input type="file" id="syxFileInput" accept=".syx" />
      <span class="patch-status" id="bankInfo">No bank loaded</span>
      <label>🎯 Patch</label>
      <select id="patchSelect" disabled><option value="">— load a bank —</option></select>
      <label>➡️ Dest</label>
      <input type="number" id="destProg" min="0" max="127" value="0" />
      <button id="sendSinglePatchBtn" disabled>📤 Send Patch</button>
      <button id="sendFullBankBtn" disabled>📤 Send Full Bank</button>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ================================================================
      // 1. OUTRUN BACKGROUND (WebGL) – forward motion, mountains, fixed sun
      // ================================================================
      (function initBackground() {
        const canvas = document.getElementById('bg-canvas');

        // ---- Configurable background state ----
        // Currently just "speed" (forward-motion speed; negative = reverse),
        // read from the canvas's data-speed attribute and kept live via a
        // MutationObserver, so any script can update it in real time by
        // just changing the attribute. New config knobs can follow this
        // same pattern later (parse a data-* attr into bgConfig, add a
        // matching uniform, set it each frame in render()).
        const bgConfig = { speed: 6.0 };
        function readSpeedFromAttr() {
          const v = parseFloat(canvas.dataset.speed);
          bgConfig.speed = Number.isFinite(v) ? v : 6.0;
        }
        readSpeedFromAttr();
        const bgAttrObserver = new MutationObserver((mutations) => {
          for (const m of mutations) {
            if (m.type === 'attributes' && m.attributeName === 'data-speed') {
              readSpeedFromAttr();
            }
          }
        });
        bgAttrObserver.observe(canvas, { attributes: true, attributeFilter: ['data-speed'] });

        // Public helper — usable from anywhere, any time:
        //   window.setBackgroundSpeed(-4)   // run the scene in reverse
        //   window.setBackgroundSpeed(0)    // freeze forward motion
        window.setBackgroundSpeed = function(value) {
          canvas.dataset.speed = value; // triggers the observer above
        };

        const gl = canvas.getContext('webgl2', { alpha: false, antialias: true });
        if (!gl) {
          const ctx = canvas.getContext('2d');
          let w, h;
          function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
          }
          window.addEventListener('resize', resize);
          resize();
          function drawFallback() {
            const grad = ctx.createRadialGradient(w*0.5, h*0.5, 0, w*0.5, h*0.5, Math.max(w,h)*0.7);
            grad.addColorStop(0, '#1a0a2e');
            grad.addColorStop(0.5, '#2a1a4e');
            grad.addColorStop(1, '#0a0512');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            requestAnimationFrame(drawFallback);
          }
          drawFallback();
          return;
        }

        const vsSource = `#version 300 es
          in vec2 a_position;
          void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
          }
        `;

        const fsSource = `#version 300 es
          precision highp float;
          uniform vec2  u_resolution;
          uniform float u_time;
          uniform float u_speed;   // forward-motion speed; negative = reverse
          out vec4 outColor;

          // Ported from a Shadertoy-style raymarched retro sun/grid shader.
          // The original's backbuffer/motion-blur sampling was dead code
          // (computed but never actually blended into the output), so it's
          // dropped here — this is a single-pass port, no feedback texture.

          #define flickerFreq 1400.0
          #define flickerSpeed 30.0
          #define flickerIntensity 0.1

          #define iters 70
          #define minDst 0.001
          #define lineWidth 0.2
          #define lineCountX 35.0
          #define lineCountY (50.0/3.0)

          #define gridColor vec3(0.2, 0.05, 1.0)

          float hash(vec2 seed) {
            return fract(sin(dot(seed, vec2(12.9898, 4.1414))) * 43758.5453);
          }

          float getHeight(vec2 uv) {
            float time = u_time;
            uv += 0.5;
            uv.y -= time * u_speed;
            float y1 = floor(uv.y);
            float y2 = floor(uv.y + 1.0);
            float x1 = floor(uv.x);
            float x2 = floor(uv.x + 1.0);
            float iX1 = mix(hash(vec2(x1, y1)), hash(vec2(x2, y1)), fract(uv.x));
            float iX2 = mix(hash(vec2(x1, y2)), hash(vec2(x2, y2)), fract(uv.x));
            return mix(iX1, iX2, fract(uv.y));
          }

          float getDistance(vec3 p) {
            return p.z - (1.0 - cos(p.x * 15.0)) * 0.03 * getHeight(vec2(p.x * lineCountX, p.y * lineCountY));
          }

          float getGridColor(vec2 uv) {
            float time = u_time;
            float zoom = 1.0;
            float col = 0.0;
            vec3 cam = vec3(0.0, 1.0, 0.1);
            vec3 lookat = vec3(0.0);
            vec3 fwd = normalize(lookat - cam);
            vec3 up = normalize(cross(fwd, vec3(1.0, 0.0, 0.0)));
            vec3 right = cross(up, fwd);
            vec3 c = cam + fwd * zoom;
            vec3 i = c + right * uv.x + up * uv.y;
            vec3 ray = normalize(i - cam);

            float distSur = 0.0;
            float distOrigin = 0.0;
            vec3 p = cam;
            for (int k = 0; k < iters; k++) {
              distSur = getDistance(p);
              if (distOrigin > 2.0) break;
              if (distSur < minDst) {
                float lineW = lineWidth * distOrigin;
                float xLines = smoothstep(lineW, 0.0, abs(fract(p.x * lineCountX) - 0.5));
                float yLines = smoothstep(lineW * 2.0, 0.0, abs(fract(p.y * lineCountY - time * u_speed) - 0.5));
                col += max(xLines, yLines);
                break;
              }
              p += ray * distSur;
              distOrigin += distSur;
            }
            return max(0.0, col - (distOrigin * 0.8));
          }

          void main() {
            float time = u_time;
            vec2 R = u_resolution;
            float sunHeight = sin(time * 0.1) * 0.1 + 0.1;

            // gl_FragCoord.y is 0 at the bottom in WebGL (same as Shadertoy),
            // so no flip is needed here — the grid sits low, the sun sits high.
            vec2 uv = (gl_FragCoord.xy - 0.5 * R) / R.y + 0.5;

            uv.y -= sunHeight;

            float dist = 2.5 * length(uv - vec2(0.5, 0.5));
            float divisions = 50.0;

            float pattern = (sin(uv.y * divisions * 10.0 - time * 2.0) * 1.2 + uv.y * 8.3) * uv.y - 1.5 +
              sin(uv.x * 20.0 + time * 5.0) * 0.01;
            float sunOutline = smoothstep(0.0, -0.0315, max(dist - 0.315, -pattern));

            vec3 col = sunOutline * mix(vec3(4.0, 0.0, 0.2), vec3(1.0, 1.1, 0.0), uv.y);

            float glow = max(0.0, 1.0 - dist * 1.25);
            glow = min(glow * glow * glow, 0.325);
            col += glow * vec3(1.5, 0.3, 1.2) * 1.1;

            uv -= 0.5;
            uv.y += sunHeight;

            uv.y += 0.18;
            if (uv.y < 0.1) {
              col += getGridColor(uv) * 4.0 * gridColor;
            }

            vec4 fragColor = (1.3 + sin(time * flickerSpeed + uv.y * flickerFreq) * flickerIntensity) * vec4(col, 1.0);
            float scanline = smoothstep(1.0 - 0.2 / flickerFreq, 1.0, sin(time * flickerSpeed * 0.1 + uv.y * 4.0));
            fragColor *= scanline * 0.2 + 1.0;

            outColor = clamp(fragColor, 0.0, 1.0);
          }
        `;

        function compileShader(src, type) {
          const sh = gl.createShader(type);
          gl.shaderSource(sh, src);
          gl.compileShader(sh);
          if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
            console.error('Shader compile error:', gl.getShaderInfoLog(sh));
            gl.deleteShader(sh);
            return null;
          }
          return sh;
        }

        const vs = compileShader(vsSource, gl.VERTEX_SHADER);
        const fs = compileShader(fsSource, gl.FRAGMENT_SHADER);
        if (!vs || !fs) {
          const ctx = canvas.getContext('2d');
          let w, h;
          function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
          }
          window.addEventListener('resize', resize);
          resize();
          function drawGradient() {
            const grad = ctx.createRadialGradient(w*0.5, h*0.5, 0, w*0.5, h*0.5, Math.max(w,h)*0.7);
            grad.addColorStop(0, '#1a0a2e');
            grad.addColorStop(0.5, '#2a1a4e');
            grad.addColorStop(1, '#0a0512');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            requestAnimationFrame(drawGradient);
          }
          drawGradient();
          return;
        }

        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
          const ctx = canvas.getContext('2d');
          let w, h;
          function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
          }
          window.addEventListener('resize', resize);
          resize();
          function drawGradient() {
            const grad = ctx.createRadialGradient(w*0.5, h*0.5, 0, w*0.5, h*0.5, Math.max(w,h)*0.7);
            grad.addColorStop(0, '#1a0a2e');
            grad.addColorStop(0.5, '#2a1a4e');
            grad.addColorStop(1, '#0a0512');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            requestAnimationFrame(drawGradient);
          }
          drawGradient();
          return;
        }

        const posBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(prog, 'a_position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

        const resLoc = gl.getUniformLocation(prog, 'u_resolution');
        const timeLoc = gl.getUniformLocation(prog, 'u_time');
        const speedLoc = gl.getUniformLocation(prog, 'u_speed');

        function resize() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          canvas.width = w;
          canvas.height = h;
          gl.viewport(0, 0, w, h);
        }
        window.addEventListener('resize', resize);
        resize();

        let startTime = performance.now();
        function render() {
          const now = performance.now();
          const elapsed = (now - startTime) / 1000;
          gl.useProgram(prog);
          gl.uniform2f(resLoc, canvas.width, canvas.height);
          gl.uniform1f(timeLoc, elapsed);
          gl.uniform1f(speedLoc, bgConfig.speed);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          requestAnimationFrame(render);
        }
        render();
      })();


      // ================================================================
      // 2. MIDI / PATCH MANAGER
      // ================================================================
      const FM1_OPERATOR_COUNT = 6;
      const FM1_OPERATOR_PARAMETER_COUNT = 21;
      const FM1_VOICE_NAME_LENGTH = 10;
      const FM1_VOICE_NAME_START = 118;

      const DX7_BANK_VOICE_COUNT = 32;
      const DX7_PACKED_VOICE_SIZE = 128;
      const DX7_BANK_DATA_SIZE = DX7_BANK_VOICE_COUNT * DX7_PACKED_VOICE_SIZE;
      const DX7_BANK_FILE_SIZE = DX7_BANK_DATA_SIZE + 8;

      const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

      function getNoteName(note) {
        const octave = Math.floor(note / 12) - 1;
        const noteIndex = ((note % 12) + 12) % 12;
        return NOTE_NAMES[noteIndex] + octave;
      }

      const outputSelect = document.getElementById('midiOutputSelect');
      const inputSelect = document.getElementById('midiInputSelect');
      const connectBtn = document.getElementById('connectBtn');
      const statusBadgeOut = document.getElementById('statusBadgeOut');
      const statusBadgeIn = document.getElementById('statusBadgeIn');
      const pianoContainer = document.getElementById('pianoContainer');
      const logArea = document.getElementById('logArea');
      const clearLogBtn = document.getElementById('clearLogBtn');
      const showRawCheck = document.getElementById('showRawCheck');
      const syxFileInput = document.getElementById('syxFileInput');
      const patchSelect = document.getElementById('patchSelect');
      const destProg = document.getElementById('destProg');
      const sendSinglePatchBtn = document.getElementById('sendSinglePatchBtn');
      const sendFullBankBtn = document.getElementById('sendFullBankBtn');
      const bankInfo = document.getElementById('bankInfo');

      let midiAccess = null, selectedOutput = null, selectedInput = null;
      let activeNotes = new Set(), scheduledTimeouts = [];
      let loadedPatches = [];
      let fullBankData = null;

      const KEYBOARD_MAP = {
        'z': 60, 's': 61, 'x': 62, 'd': 63, 'c': 64,
        'v': 65, 'g': 66, 'b': 67, 'h': 68, 'n': 69,
        'j': 70, 'm': 71
      };

      function sendMidi(status, data1, data2) {
        if (!selectedOutput) return false;
        try { if (data2 === undefined) selectedOutput.send([status, data1]); else selectedOutput.send([status, data1, data2]); return true; } catch(e) { console.warn('MIDI send error:', e); return false; }
      }
      function noteOn(note, velocity=105) {
        if (activeNotes.has(note)) return;
        activeNotes.add(note); sendMidi(0x90, note, velocity);
        const el = document.querySelector(`.key[data-note="${note}"]`); if (el) el.classList.add('active');
      }
      function noteOff(note) {
        if (!activeNotes.has(note)) return;
        activeNotes.delete(note); sendMidi(0x80, note, 0);
        const el = document.querySelector(`.key[data-note="${note}"]`); if (el) el.classList.remove('active');
      }
      function allNotesOff() {
        for (const note of activeNotes) { sendMidi(0x80, note, 0); const el = document.querySelector(`.key[data-note="${note}"]`); if (el) el.classList.remove('active'); }
        activeNotes.clear(); for (const t of scheduledTimeouts) clearTimeout(t); scheduledTimeouts = [];
      }

      function sendSysEx(data, callback) {
        if (!selectedOutput) {
          alert('No MIDI output connected.');
          if (callback) callback();
          return;
        }
        try {
          selectedOutput.send(data);
          if (callback) callback();
        } catch (e) {
          console.error('SysEx send error:', e);
          alert('Error sending SysEx: ' + e.message);
          if (callback) callback();
        }
      }

      function unpackDx7Voice(packed) {
        const unpacked = [];
        for (let operator = 0; operator < FM1_OPERATOR_COUNT; operator += 1) {
          const offset = operator * 17;
          for (let i = 0; i < 11; i += 1) {
            unpacked.push(packed[offset + i]);
          }
          unpacked.push(packed[offset + 11] & 0x03);
          unpacked.push((packed[offset + 11] >> 2) & 0x03);
          unpacked.push(packed[offset + 12] & 0x07);
          unpacked.push(packed[offset + 13] & 0x03);
          unpacked.push((packed[offset + 13] >> 2) & 0x07);
          unpacked.push(packed[offset + 14]);
          unpacked.push(packed[offset + 15] & 0x01);
          unpacked.push((packed[offset + 15] >> 1) & 0x1f);
          unpacked.push(packed[offset + 16]);
          unpacked.push((packed[offset + 12] >> 3) & 0x0f);
        }
        for (let i = 102; i < 110; i += 1) {
          unpacked.push(packed[i]);
        }
        unpacked.push(packed[110] & 0x1f);
        unpacked.push(packed[111] & 0x07);
        unpacked.push((packed[111] >> 3) & 0x01);
        for (let i = 112; i < 116; i += 1) {
          unpacked.push(packed[i]);
        }
        unpacked.push(packed[116] & 0x01);
        unpacked.push((packed[116] >> 1) & 0x07);
        unpacked.push((packed[116] >> 4) & 0x07);
        for (let i = 117; i < 128; i += 1) {
          unpacked.push(packed[i]);
        }
        return Uint8Array.from(unpacked);
      }

      function makeDx7SingleVoicePayload(packedVoice, channel) {
        if (packedVoice.length !== DX7_PACKED_VOICE_SIZE) {
          throw new Error(`Expected ${DX7_PACKED_VOICE_SIZE} bytes, received ${packedVoice.length}.`);
        }
        const data = unpackDx7Voice(packedVoice);
        const checksum = (128 - (data.reduce((sum, byte) => sum + byte, 0) & 0x7f)) & 0x7f;
        return Uint8Array.from([(channel - 1) & 0x0f, 0x00, 0x01, 0x1b, ...data, checksum]);
      }

      function decodeVoiceName(data) {
        let name = '';
        for (let i = 0; i < FM1_VOICE_NAME_LENGTH; i += 1) {
          const code = data[FM1_VOICE_NAME_START + i];
          if (code >= 0x20 && code <= 0x7e) {
            name += String.fromCharCode(code);
          } else {
            name += ' ';
          }
        }
        return name.trim() || 'UNTITLED';
      }

      function parseDx7Bank(file) {
        const bytes = new Uint8Array(file);
        if (bytes.length !== DX7_BANK_FILE_SIZE) {
          throw new Error(`Expected 4104-byte DX7 bank; received ${bytes.length} bytes.`);
        }
        if (bytes[0] !== 0xf0 || bytes[1] !== 0x43 || bytes[3] !== 0x09 ||
            bytes[4] !== 0x20 || bytes[5] !== 0x00 || bytes.at(-1) !== 0xf7) {
          throw new Error('Not a Yamaha DX7 32-voice bulk SysEx bank.');
        }
        const voiceData = bytes.slice(6, 6 + DX7_BANK_DATA_SIZE);
        const checksum = (128 - (voiceData.reduce((sum, byte) => sum + byte, 0) & 0x7f)) & 0x7f;
        if (checksum !== bytes.at(-2)) {
          throw new Error('DX7 bank checksum invalid.');
        }
        const voices = [];
        for (let i = 0; i < DX7_BANK_VOICE_COUNT; i += 1) {
          const data = voiceData.slice(i * DX7_PACKED_VOICE_SIZE, (i + 1) * DX7_PACKED_VOICE_SIZE);
          const name = decodeVoiceName(data);
          voices.push({ data, name });
        }
        return voices;
      }

      syxFileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const buffer = e.target.result;
            const voices = parseDx7Bank(buffer);
            loadedPatches = voices;
            fullBankData = new Uint8Array(buffer);

            patchSelect.innerHTML = '';
            if (loadedPatches.length === 0) {
              patchSelect.innerHTML = '<option value="">— no patches —</option>';
              patchSelect.disabled = true;
              bankInfo.textContent = 'No patches found';
              sendSinglePatchBtn.disabled = true;
              sendFullBankBtn.disabled = true;
              return;
            }
            patchSelect.disabled = false;
            loadedPatches.forEach((p, idx) => {
              const opt = document.createElement('option');
              opt.value = idx;
              opt.textContent = `${idx+1}: ${p.name}`;
              patchSelect.appendChild(opt);
            });
            patchSelect.value = 0;
            bankInfo.textContent = `Loaded ${loadedPatches.length} patches`;
            sendSinglePatchBtn.disabled = !selectedOutput;
            sendFullBankBtn.disabled = !selectedOutput;
            const ts = new Date().toLocaleTimeString();
            logArea.value += `[${ts}] ✅ Loaded .syx file: ${loadedPatches.length} patches\n`;
            logArea.scrollTop = logArea.scrollHeight;
          } catch (err) {
            alert('Error parsing .syx file: ' + err.message);
            console.error(err);
          }
        };
        reader.readAsArrayBuffer(file);
      });

      function sendSinglePatch() {
        if (!selectedOutput) { alert('Connect to a MIDI output first.'); return; }
        const idx = parseInt(patchSelect.value, 10);
        if (isNaN(idx) || idx < 0 || idx >= loadedPatches.length) {
          alert('Please select a patch.');
          return;
        }
        const dest = parseInt(destProg.value, 10);
        if (isNaN(dest) || dest < 0 || dest > 127) {
          alert('Destination program must be between 0 and 127.');
          return;
        }

        sendSinglePatchBtn.disabled = true;
        sendSinglePatchBtn.textContent = '⏳ Sending...';

        if (selectedOutput) {
          sendMidi(0xC0, dest);
        }

        setTimeout(() => {
          const channel = 1;
          const packedVoice = loadedPatches[idx].data;
          try {
            const payload = makeDx7SingleVoicePayload(packedVoice, channel);
            const syx = new Uint8Array(2 + payload.length + 1);
            syx[0] = 0xF0;
            syx[1] = 0x43;
            syx.set(payload, 2);
            syx[2 + payload.length] = 0xF7;

            if (showRawCheck.checked) {
              const hex = Array.from(syx).map(b => '0x' + b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
              logArea.value += `[${new Date().toLocaleTimeString()}] Sending SysEx: ${hex}\n`;
            }

            sendSysEx(syx, () => {
              sendSinglePatchBtn.disabled = (loadedPatches.length===0 || !selectedOutput);
              sendSinglePatchBtn.textContent = '📤 Send Patch';
              const ts = new Date().toLocaleTimeString();
              logArea.value += `[${ts}] ✅ Patch "${loadedPatches[idx].name}" sent to slot ${dest}\n`;
              logArea.scrollTop = logArea.scrollHeight;
            });
          } catch (e) {
            console.error('Error building SysEx:', e);
            alert('Error: ' + e.message);
            sendSinglePatchBtn.disabled = false;
            sendSinglePatchBtn.textContent = '📤 Send Patch';
          }
        }, 50);
      }

      function sendFullBank() {
        if (!selectedOutput) { alert('Connect to a MIDI output first.'); return; }
        if (!fullBankData) { alert('No bank data loaded.'); return; }
        sendFullBankBtn.disabled = true;
        sendFullBankBtn.textContent = '⏳ Sending...';
        sendSysEx(fullBankData, () => {
          sendFullBankBtn.disabled = !selectedOutput;
          sendFullBankBtn.textContent = '📤 Send Full Bank';
          const ts = new Date().toLocaleTimeString();
          logArea.value += `[${ts}] ✅ Full bank sent to FM-1\n`;
          logArea.scrollTop = logArea.scrollHeight;
        });
      }

      sendSinglePatchBtn.addEventListener('click', sendSinglePatch);
      sendFullBankBtn.addEventListener('click', sendFullBank);

      function midiMessageToString(data, showRaw) {
        if (!data || data.length===0) return '';
        const rawHex = Array.from(data).map(b=>'0x'+b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
        const status = data[0]; const channel = (status&0x0F)+1; const command = status&0xF0;
        let desc='';
        if (status===0xF0) desc=`SysEx (${data.length} bytes)`;
        else if (status===0xF7) desc='SysEx End';
        else if (status>=0xF8) { const rt={0xF8:'Timing Clock',0xFA:'Start',0xFB:'Continue',0xFC:'Stop',0xFE:'Active Sensing',0xFF:'System Reset'}; desc=`Realtime: ${rt[status]||'0x'+status.toString(16)}`; }
        else {
          switch(command) {
            case 0x80: {
              const note=data[1], vel=data[2]||0;
              const name = getNoteName(note);
              desc=`Ch${channel} Note Off : ${name} (${note}) vel=${vel}`;
              break;
            }
            case 0x90: {
              const note=data[1], vel=data[2]||0;
              const name = getNoteName(note);
              desc=`Ch${channel} Note On  : ${name} (${note}) vel=${vel}`;
              break;
            }
            case 0xA0: {
              const note=data[1], pressure=data[2]||0;
              const name = getNoteName(note);
              desc=`Ch${channel} PolyPressure: ${name} (${note}) pressure=${pressure}`;
              break;
            }
            case 0xB0: {
              const cc=data[1], val=data[2];
              const ccName=cc===10?'Pan':cc===1?'Modulation':cc===7?'Volume':cc===11?'Expression':cc===64?'Sustain':cc===91?'Reverb':cc===93?'Chorus':`CC${cc}`;
              desc=`Ch${channel} Control  : ${ccName} = ${val}`;
              break;
            }
            case 0xC0: {
              const prog=data[1];
              desc=`Ch${channel} Program   : ${prog}`;
              break;
            }
            case 0xD0: {
              const pressure=data[1];
              desc=`Ch${channel} ChannelPressure: ${pressure}`;
              break;
            }
            case 0xE0: {
              const lsb=data[1], msb=data[2];
              const val=(msb<<7)|lsb;
              desc=`Ch${channel} PitchBend : ${val}`;
              break;
            }
            default: desc=`Ch${channel} Unknown   : ${rawHex}`;
          }
        }
        return showRaw ? `[${rawHex}] ${desc}` : desc;
      }

      function appendLog(data, showRaw) {
        const ts = new Date().toLocaleTimeString();
        const msg = midiMessageToString(data, showRaw);
        if (!msg) return;
        logArea.value += `[${ts}] ${msg}\n`;
        logArea.scrollTop = logArea.scrollHeight;
        const lines = logArea.value.split('\n');
        if (lines.length > 500) logArea.value = lines.slice(-400).join('\n');
      }

      function attachInputListener(input) {
        if (!input) return;
        input.onmidimessage = (event) => { appendLog(event.data, showRawCheck.checked); };
      }

      // ----- Build Piano (F0 to G8) -----
      function buildPiano() {
        pianoContainer.innerHTML = '';
        const wrapper = document.createElement('div');
        wrapper.className = 'piano';
        wrapper.style.position = 'relative';

        const NOTE_START = 29; // F0
        const NOTE_END = 103;  // G8
        const WHITE_STEPS = [0, 2, 4, 5, 7, 9, 11];

        const whiteNotes = [];
        const blackNotes = [];
        for (let note = NOTE_START; note <= NOTE_END; note++) {
          const step = (note - 12) % 12;
          if (WHITE_STEPS.includes(step)) {
            whiteNotes.push(note);
          } else {
            blackNotes.push(note);
          }
        }

        whiteNotes.forEach((note) => {
          const key = document.createElement('div');
          key.className = 'key key-white';
          key.dataset.note = note;
          const label = document.createElement('span');
          label.className = 'key-label';
          label.textContent = getNoteName(note);
          key.appendChild(label);
          attachEvents(key, note);
          wrapper.appendChild(key);
        });

        // Black keys
        const whiteWidth = 26;
        const blackWidth = 16;
        // Chromatic steps of WHITE keys that are immediately followed by a
        // black key (C, D, F, G, A) — there's no black key between E-F or B-C.
        // FIX: the previous code checked the white key's own step against a
        // map keyed by the BLACK key's steps ({1,3,6,8,10}), which never
        // matched since a white key's step is always 0,2,4,5,7,9,11 — so no
        // black key <div>s were ever created. This map fixes that.
        const whiteStepsWithBlackAfter = {0:true, 2:true, 5:true, 7:true, 9:true};
        let whiteIdx = 0;
        for (let i = 0; i < whiteNotes.length; i++) {
          const note = whiteNotes[i];
          const step = (note - 12) % 12;
          if (step in whiteStepsWithBlackAfter) {
            const blackNote = note + 1;
            if (blackNote >= NOTE_START && blackNote <= NOTE_END) {
              const key = document.createElement('div');
              key.className = 'key key-black';
              key.dataset.note = blackNote;
              const label = document.createElement('span');
              label.className = 'key-label';
              label.textContent = getNoteName(blackNote);
              key.appendChild(label);
              const leftPos = (whiteIdx + 1) * whiteWidth - blackWidth / 2;
              key.style.left = leftPos + 'px';
              key.style.width = blackWidth + 'px';
              attachEvents(key, blackNote);
              wrapper.appendChild(key);
            }
          }
          whiteIdx++;
        }

        pianoContainer.appendChild(wrapper);
      }

      function attachEvents(key, note) {
        const start = (e) => { e.preventDefault(); if (!selectedOutput) { alert('Connect to a MIDI output first.'); return; } noteOn(note); };
        const end = (e) => { e.preventDefault(); noteOff(note); };
        key.addEventListener('mousedown', start);
        key.addEventListener('mouseup', end);
        key.addEventListener('mouseleave', end);
        key.addEventListener('touchstart', start, { passive: false });
        key.addEventListener('touchend', end, { passive: false });
        key.addEventListener('touchcancel', end, { passive: false });
      }

      function updateOutputs() {
        if (!midiAccess) { outputSelect.disabled=true; outputSelect.innerHTML='<option value="">— none —</option>'; return; }
        const outputs = Array.from(midiAccess.outputs.values());
        if (outputs.length===0) { outputSelect.disabled=true; outputSelect.innerHTML='<option value="">— none —</option>'; statusBadgeOut.textContent='⚪ none'; statusBadgeOut.className='status-badge'; return; }
        outputSelect.disabled=false;
        outputSelect.innerHTML = outputs.map(o=>`<option value="${o.id}">${o.name||'Unnamed'}</option>`).join('');
        outputSelect.value = outputs[0].id;
        selectedOutput = midiAccess.outputs.get(outputs[0].id)||null;
        updateUI();
      }
      function updateInputs() {
        if (!midiAccess) { inputSelect.disabled=true; inputSelect.innerHTML='<option value="">— none —</option>'; return; }
        const inputs = Array.from(midiAccess.inputs.values());
        if (inputs.length===0) { inputSelect.disabled=true; inputSelect.innerHTML='<option value="">— none —</option>'; statusBadgeIn.textContent='⚪ none'; statusBadgeIn.className='status-badge'; return; }
        inputSelect.disabled=false;
        inputSelect.innerHTML = inputs.map(inp=>`<option value="${inp.id}">${inp.name||'Unnamed'}</option>`).join('');
        inputSelect.value = inputs[0].id;
        selectedInput = midiAccess.inputs.get(inputs[0].id)||null;
        if (selectedInput) { attachInputListener(selectedInput); statusBadgeIn.textContent='🟢 listening'; statusBadgeIn.className='status-badge online'; } else { statusBadgeIn.textContent='⚪ inactive'; statusBadgeIn.className='status-badge'; }
        updateUI();
      }
      function connectMIDI() {
        if (navigator.requestMIDIAccess) {
          navigator.requestMIDIAccess({ sysex: true })
            .then((access) => {
              midiAccess = access;
              connectBtn.textContent = '🔌 Refresh';
              updateOutputs(); updateInputs();
              midiAccess.onstatechange = () => { updateOutputs(); updateInputs(); };
            })
            .catch((err) => {
              console.error('Web MIDI error:', err);
              statusBadgeOut.textContent='🔴 error'; statusBadgeOut.className='status-badge';
              statusBadgeIn.textContent='🔴 error'; statusBadgeIn.className='status-badge';
              alert('Could not access MIDI. Please use Chrome/Edge and allow MIDI access.');
            });
        } else {
          alert('Web MIDI API is not supported in this browser. Please use Chrome, Edge, or Opera.');
        }
      }
      function updateUI() {
        const hasOutput = !!selectedOutput;
        const hasInput = !!selectedInput;
        sendSinglePatchBtn.disabled = (loadedPatches.length===0 || !hasOutput);
        sendFullBankBtn.disabled = (!fullBankData || !hasOutput);
        statusBadgeOut.textContent = hasOutput ? '🟢 connected' : '⚪ off';
        statusBadgeOut.className = hasOutput ? 'status-badge online' : 'status-badge';
        statusBadgeIn.textContent = hasInput ? '🟢 listening' : '⚪ off';
        statusBadgeIn.className = hasInput ? 'status-badge online' : 'status-badge';
      }

      connectBtn.addEventListener('click', connectMIDI);
      outputSelect.addEventListener('change', () => { if(!midiAccess)return; selectedOutput=midiAccess.outputs.get(outputSelect.value)||null; allNotesOff(); updateUI(); });
      inputSelect.addEventListener('change', () => {
        if(!midiAccess)return;
        if(selectedInput) selectedInput.onmidimessage=null;
        selectedInput=midiAccess.inputs.get(inputSelect.value)||null;
        if(selectedInput) { attachInputListener(selectedInput); statusBadgeIn.textContent='🟢 listening'; statusBadgeIn.className='status-badge online'; } else { statusBadgeIn.textContent='⚪ off'; statusBadgeIn.className='status-badge'; }
        updateUI();
      });
      showRawCheck.addEventListener('change', () => {});
      clearLogBtn.addEventListener('click', () => { logArea.value=''; });

      document.addEventListener('keydown', (e) => { if(e.repeat)return; const key=e.key.toLowerCase(); if(key in KEYBOARD_MAP) { e.preventDefault(); if(!selectedOutput){alert('Connect to a MIDI output first.'); return;} noteOn(KEYBOARD_MAP[key]); } });
      document.addEventListener('keyup', (e) => { const key=e.key.toLowerCase(); if(key in KEYBOARD_MAP) { e.preventDefault(); noteOff(KEYBOARD_MAP[key]); } });
      document.addEventListener('visibilitychange', () => { if(document.hidden) allNotesOff(); });
      window.addEventListener('beforeunload', () => allNotesOff());

      buildPiano();
      setTimeout(connectMIDI, 400);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MIDI Stereo · DX7 Patch Manager</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a12" />
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a12; touch-action: manipulation;
    }
    #bg-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0;
      display: block; pointer-events: none;
    }

    /* 2D NOTE-GRID TRACKER — sits between the 3D background and the UI chrome */
    #note-grid-canvas {
      position: fixed; top: 0; left: 0; z-index: 5;
      display: block; touch-action: none; cursor: grab;
    }
    #note-grid-canvas.dragging {
      cursor: grabbing;
    }

    /* Flashes the currently selected or committed step duration */
    #durationFlash {
      position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%) scale(0.85);
      font-size: 3rem; font-weight: 800; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif;
      text-shadow: 0 0 24px rgba(120,180,255,0.85), 0 2px 10px rgba(0,0,0,0.7);
      opacity: 0; pointer-events: none; z-index: 25;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #durationFlash.show {
      opacity: 1; transform: translate(-50%, -50%) scale(1);
      transition: opacity 0.05s ease, transform 0.15s cubic-bezier(.2, 1.4, .4, 1);
    }

    /* TOP LEFT LOG */
    #top-left-log {
      position: fixed; top: 20px; left: 20px; z-index: 20;
      display: none;
      width: 320px; max-width: calc(100vw - 40px);
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 12px; padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      pointer-events: auto;
    }
    #top-left-log .log-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap;
    }
    #top-left-log .log-header span {
      color: #b0d0f0; font-size: 0.8rem; font-weight: 600;
    }
    #top-left-log .log-header label {
      color: #8aacd8; font-size: 0.7rem; display: flex; align-items: center; gap: 4px; cursor: pointer; margin-left: auto;
    }
    #top-left-log .log-header label input { accent-color: #6a9ae0; width: 14px; height: 14px; cursor: pointer; }
    #top-left-log .log-header button {
      background: rgba(47,61,94,0.7); border: 1px solid rgba(74,96,136,0.5);
      color: #d6e6ff; padding: 2px 12px; border-radius: 14px; font-size: 0.7rem; cursor: pointer;
    }
    #top-left-log .log-header button:active { transform: scale(0.95); }
    #logArea {
      width: 100%; height: 90px; background: rgba(11,20,34,0.4); border: 1px solid rgba(26,42,68,0.5);
      border-radius: 8px; color: #b0d0f0; font-family: 'Courier New', monospace; font-size: 0.6rem;
      padding: 4px 6px; resize: none; outline: none; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: #2a4060 transparent;
    }
    #logArea::-webkit-scrollbar { width: 4px; }
    #logArea::-webkit-scrollbar-thumb { background: #2a4060; border-radius: 10px; }

    /* TOP MIDI / INSTRUMENT BARS */
    #top-header {
      --keyboard-width: 100%;
      position: fixed; top: 0; left: 50%; z-index: 20;
      width: min(var(--keyboard-width), calc(100vw - 16px));
      transform: translateX(-50%);
      background: rgba(0,0,0,0.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 7px 14px;
      pointer-events: auto;
      display: grid;
      grid-template-columns: auto minmax(220px, 0.85fr) minmax(360px, 1.8fr) minmax(150px, 0.55fr);
      gap: 10px;
      align-items: start;
    }
    #app-nav,
    #top-right-midi,
    #patch-controls,
    #grid-tools {
      position: static;
      background: rgba(9,14,28,0.62);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 7px 9px;
      pointer-events: auto;
    }
    #app-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
    }
    .home-menu {
      width: 30px;
      height: 26px;
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding: 0 7px;
      border: 1px solid rgba(138,172,216,0.55);
      border-radius: 8px;
      background: rgba(30,45,74,0.62);
      flex: 0 0 auto;
      text-decoration: none;
    }
    .home-menu span {
      display: block;
      height: 2px;
      border-radius: 999px;
      background: #d6e6ff;
    }
    .home-menu:hover { background: rgba(47,61,94,0.9); }
    pwa-check-update { display: inline-block; flex-shrink: 0; min-width: 58px; }
    .btn-check-update {
      background: rgba(248,250,255,0.94);
      color: #152033;
      padding: 1px 10px;
      border-radius: 40px;
      font: inherit;
      font-weight: 750;
      font-size: 0.72rem;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.78);
      height: 26px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.22), inset 0 -1px 0 rgba(0,0,0,0.1);
    }
    .btn-check-update:active { transform: scale(0.95); }
    #top-right-midi {
      display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    }
    #midi-connect-row,
    #midi-status-row {
      display: contents;
    }
    #top-right-midi .connect-section {
      display: flex; align-items: center; gap: 4px;
    }
    #top-right-midi .connect-section label {
      font-size: 0.6rem; color: #8aacd8; font-weight: 600;
    }
    #top-right-midi .connect-section select {
      background: rgba(30,45,74,0.8); border: 1px solid rgba(61,90,128,0.6);
      color: #d6e6ff; padding: 2px 8px; border-radius: 30px; font-size: 0.7rem;
      outline: none; cursor: pointer; min-width: 70px;
      -webkit-appearance: none; appearance: none;
    }
    #top-right-midi .connect-section select:disabled { opacity: 0.4; cursor: not-allowed; }
    #top-right-midi button {
      background: rgba(248,250,255,0.94); color: #152033; padding: 1px 12px;
      border-radius: 40px; font-weight: 750; font-size: 0.9rem; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.78); height: 26px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.22), inset 0 -1px 0 rgba(0,0,0,0.1);
    }
    #top-right-midi button:active { transform: scale(0.95); }
    #top-right-midi .status-badge {
      font-size: 0.9rem; padding: 1px 7px; border-radius: 30px;
      background: rgba(106,111,124,0.62); color: rgba(230,234,242,0.62); border: 1px solid rgba(185,192,205,0.24);
      white-space: nowrap; height: 24px; min-width: 28px; display: flex; align-items: center; justify-content: center;
      filter: grayscale(0.75);
    }
    #top-right-midi .status-badge.online {
      background: rgba(248,250,255,0.94); color: #102034; border-color: rgba(255,255,255,0.78);
      filter: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.22), inset 0 -1px 0 rgba(0,0,0,0.1);
    }
    #top-right-midi .status-badge.recording {
      background: rgba(255,235,235,0.96); color: #4b1010; border-color: rgba(255,175,175,0.86);
      filter: none;
    }
    #top-right-midi .status-badge.playing {
      background: rgba(238,255,244,0.96); color: #0c3a1d; border-color: rgba(174,255,202,0.86);
      filter: none;
    }

    #patch-controls {
      display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
      min-height: 32px;
    }
    #patch-controls label {
      font-size: 0.65rem; color: #7a9abb; font-weight: 600; white-space: nowrap;
    }
    #patch-controls input[type="file"] {
      background: rgba(30,45,74,0.8); border: 1px solid rgba(61,90,128,0.6);
      color: #d6e6ff; padding: 2px 8px; border-radius: 30px; font-size: 0.65rem;
      cursor: pointer; max-width: 130px;
    }
    #patch-controls input[type="number"] {
      background: rgba(30,45,74,0.8); border: 1px solid rgba(61,90,128,0.6);
      color: #d6e6ff; padding: 1px 4px; border-radius: 30px; text-align: center;
      font-size: 0.7rem; outline: none; width: 40px;
      -moz-appearance: textfield;
    }
    #patch-controls input[type="number"]::-webkit-inner-spin-button,
    #patch-controls input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    #patch-controls select {
      background: rgba(30,45,74,0.8); border: 1px solid rgba(61,90,128,0.6);
      color: #d6e6ff; padding: 2px 8px; border-radius: 30px; font-size: 0.7rem;
      outline: none; cursor: pointer; min-width: 82px; max-width: 126px;
      -webkit-appearance: none; appearance: none;
    }
    #patch-controls select:disabled { opacity: 0.4; cursor: not-allowed; }
    #patch-controls button {
      background: rgba(47,61,94,0.8); border: 1px solid rgba(74,96,136,0.5);
      color: #d6e6ff; padding: 2px 12px; border-radius: 30px;
      font-weight: 600; font-size: 0.65rem; cursor: pointer;
      height: 24px; white-space: nowrap;
    }
    #patch-controls button:active { transform: scale(0.95); }
    #patch-controls button:disabled { opacity: 0.35; cursor: not-allowed; }
    #patch-controls .patch-status {
      font-size: 0.65rem; color: #7a9abb; white-space: nowrap;
    }

    #grid-tools {
      display: grid;
      grid-template-columns: auto 68px minmax(74px, 1fr);
      align-items: center;
      gap: 6px 7px;
    }
    #grid-tools label,
    #grid-tools span {
      color: #9fbfe8;
      font-size: 0.66rem;
      font-weight: 700;
      white-space: nowrap;
    }
    #grid-tools button,
    #grid-tools select,
    #grid-tools input {
      background: rgba(30,45,74,0.82);
      border: 1px solid rgba(74,96,136,0.55);
      color: #d6e6ff;
      border-radius: 18px;
      font-size: 0.66rem;
      font-weight: 650;
      height: 24px;
      outline: none;
    }
    #grid-tools button { cursor: pointer; padding: 2px 9px; }
    #grid-tools button.danger {
      background: rgba(96,38,58,0.82);
      border-color: rgba(190,90,118,0.5);
    }
    #grid-tools input { padding: 2px 8px; }
    #grid-tools input[type="number"] { width: 64px; text-align: center; }

    /* KEYBOARD / PERFORMANCE DOCK */
    #bottom-dock {
      --keyboard-width: 100%;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      background: rgba(0,0,0,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 6px 16px 8px 16px;
      pointer-events: auto;
      display: flex; flex-direction: column; gap: 5px;
    }
    #piano-container {
      overflow-x: auto; padding: 2px 0 4px 0;
      scrollbar-width: thin; scrollbar-color: #2a4060 transparent;
    }
    #piano-container::-webkit-scrollbar { height: 4px; }
    #piano-container::-webkit-scrollbar-thumb { background: #2a4060; border-radius: 10px; }
    #composer-controls {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      align-items: center;
      min-height: 34px;
      width: 100%;
      max-width: var(--keyboard-width);
      margin: 0 auto;
    }
    #composer-controls button,
    #composer-controls select,
    #composer-controls input {
      background: rgba(30,45,74,0.82);
      border: 1px solid rgba(74,96,136,0.55);
      color: #d6e6ff;
      border-radius: 8px;
      font-size: 0.76rem;
      font-weight: 650;
      height: 42px;
      outline: none;
    }
    #composer-controls button {
      cursor: pointer;
      padding: 2px 10px;
      white-space: nowrap;
      width: 100%;
    }
    #composer-controls button:active { transform: scale(0.96); }
    #composer-controls button.primary {
      background: rgba(38,102,124,0.9);
      border-color: rgba(90,190,210,0.55);
      color: #ecfdff;
    }
    #composer-controls button.danger {
      background: rgba(96,38,58,0.82);
      border-color: rgba(190,90,118,0.5);
    }
    #durationButtons {
      display: flex !important;
      flex-flow: row nowrap !important;
      gap: 2px;
      overflow: hidden;
      scrollbar-width: thin;
      scrollbar-color: #2a4060 transparent;
      width: 100%;
      max-width: var(--keyboard-width);
      margin: 0 auto;
    }
    #durationButtons button {
      flex: 0 1 calc((100% - 26px) / 14) !important;
      inline-size: calc((100% - 26px) / 14) !important;
      min-width: 0 !important;
      min-inline-size: 0 !important;
      max-inline-size: calc((100% - 26px) / 14);
      padding: 3px 0;
      width: auto;
      height: 40px;
      font-size: 0.58rem;
      font-weight: 750;
      white-space: nowrap !important;
      overflow: hidden;
    }
    #durationButtons button.active {
      background: rgba(255,145,92,0.92);
      border-color: rgba(255,205,150,0.75);
      color: #170b04;
      box-shadow: 0 0 16px rgba(255,145,92,0.35);
    }
    #durationButtons button span {
      display: block;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }
    #durationButtons button .duration-alt {
      font-size: 0.5rem;
      opacity: 0.72;
    }
    #composer-controls button.active {
      background: rgba(116,210,184,0.88);
      border-color: rgba(190,255,228,0.72);
      color: #06120f;
      box-shadow: 0 0 16px rgba(116,210,184,0.28);
    }
    .piano {
      --white-key-width: 26px;
      --black-key-width: 16px;
      display: flex; width: max-content; min-width: max-content; height: 100px; position: relative;
      margin: 0 auto;
      background: rgba(0,0,0,0.2); border-radius: 6px;
    }
    .key-white {
      flex: 0 0 var(--white-key-width); height: 100%;
      background: rgba(240,244,254,0.85);
      border: 1px solid rgba(176,200,232,0.5);
      border-radius: 0 0 4px 4px;
      box-shadow: 0 2px 0 rgba(176,192,216,0.3);
      cursor: pointer; position: relative;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 4px; font-size: 0.45rem; font-weight: 600;
      color: rgba(0,0,0,0.3);
      transition: background 0.06s, transform 0.06s, box-shadow 0.06s;
      touch-action: none; z-index: 1;
    }
    .key-white.active {
      background: rgba(200,223,255,0.9);
      transform: translateY(2px);
      box-shadow: 0 0 0 rgba(176,192,216,0);
      border-color: rgba(106,154,224,0.8);
    }
    .key-black {
      position: absolute; top: 0; height: 65%;
      background: rgba(26,31,46,0.9);
      border: 1px solid rgba(8,11,18,0.8);
      border-radius: 0 0 3px 3px;
      box-shadow: 0 2px 0 rgba(5,7,12,0.6), 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer; pointer-events: auto; z-index: 3;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 2px; color: rgba(255,255,255,0.15);
      font-size: 0.4rem;
      transition: background 0.06s, transform 0.06s, box-shadow 0.06s;
      touch-action: none;
      width: var(--black-key-width); margin: 0;
    }
    .key-black.active {
      background: rgba(58,74,106,0.9);
      transform: translateY(2px);
      box-shadow: 0 0 0 rgba(5,7,12,0.6), 0 2px 4px rgba(0,0,0,0.6);
      border-color: rgba(106,138,186,0.6);
    }
    .key-label {
      position: absolute; bottom: 2px; font-size: 0.4rem;
      pointer-events: none; color: rgba(255,255,255,0.3);
    }
    .key-white .key-label { color: rgba(0,0,0,0.25); }
    .key-black .key-label { color: rgba(255,255,255,0.25); }

    @media (max-width: 700px) {
      #top-left-log { top: 10px; left: 10px; width: 200px; padding: 6px 8px; }
      #logArea { height: 50px; font-size: 0.5rem; }
      #top-header { grid-template-columns: 1fr; gap: 5px; padding: 5px 8px; }
      #app-nav { padding: 4px 8px; min-height: 26px; justify-content: space-between; }
      .home-menu { height: 22px; width: 28px; }
      .btn-check-update { font-size: 0.6rem; padding: 1px 8px; height: 22px; }
      pwa-check-update { min-width: 52px; }
      #top-right-midi { padding: 4px 8px; gap: 4px; }
      #midi-connect-row, #midi-status-row { gap: 5px; }
      #top-right-midi .connect-section select { min-width: 50px; font-size: 0.6rem; padding: 1px 4px; }
      #top-right-midi button { font-size: 0.6rem; padding: 1px 10px; height: 22px; }
      #patch-controls { justify-content: flex-start; gap: 4px; min-height: 26px; padding: 4px 8px; overflow-x: auto; flex-wrap: nowrap; }
      #grid-tools { display: flex; gap: 4px; padding: 5px 6px; }
      #bottom-dock { padding: 4px 8px 6px 8px; }
      #composer-controls { gap: 5px; grid-template-columns: repeat(6, minmax(62px, 1fr)); overflow-x: auto; }
      #composer-controls button { height: 46px; font-size: 0.72rem; }
      #durationButtons { display: flex !important; flex-flow: row nowrap !important; gap: 1px; }
      #durationButtons button {
        flex-basis: calc((100% - 13px) / 14) !important;
        inline-size: calc((100% - 13px) / 14) !important;
        max-inline-size: calc((100% - 13px) / 14);
        height: 44px;
        font-size: 0.52rem;
        padding-left: 0;
        padding-right: 0;
      }
      #durationButtons button .duration-alt { font-size: 0.46rem; }
      #patternNameInput, #patternSelect { min-width: 0; }
      #patch-controls { gap: 4px; min-height: 26px; }
      #patch-controls label { font-size: 0.55rem; }
      #patch-controls select { min-width: 70px; font-size: 0.6rem; padding: 1px 4px; }
      #patch-controls button { font-size: 0.55rem; padding: 1px 8px; height: 20px; }
      .key-white { font-size: 0.35rem; }
      .key-black { font-size: 0.35rem; }
      .piano { --white-key-width: 18px; --black-key-width: 12px; height: 70px; }
    }
  </style>
</head>
<body>

  <!-- data-speed controls the background's forward-motion speed in real time.
       Negative values run the scene in reverse. Change it any time, e.g.:
         document.getElementById('bg-canvas').dataset.speed = -4;
       or use the helper: window.setBackgroundSpeed(-4); -->
  <canvas id="bg-canvas" data-speed="0"></canvas>

  <!-- 2D piano-roll tracker overlay: visualizes composed steps and playback. -->
  <canvas id="note-grid-canvas"></canvas>
  <div id="durationFlash"></div>

  <!-- TOP LEFT LOG -->
  <div id="top-left-log">
    <div class="log-header">
      <span>📋 MIDI Log</span>
      <button id="clearLogBtn">Clear</button>
      <label><input type="checkbox" id="showRawCheck" /> Raw</label>
    </div>
    <textarea id="logArea" readonly placeholder="MIDI messages appear here..." spellcheck="false"></textarea>
  </div>

  <div id="top-header">
    <div id="app-nav">
      <a class="home-menu" href="../" aria-label="Open music tools index"><span></span><span></span><span></span></a>
      <pwa-check-update><button class="btn-check-update" type="button" onclick="location.reload()">Update</button></pwa-check-update>
    </div>

    <div id="top-right-midi">
      <div id="midi-connect-row">
        <div class="connect-section">
          <label>Out</label>
          <select id="midiOutputSelect" disabled><option value="">— none —</option></select>
        </div>
        <div class="connect-section">
          <label>In</label>
          <select id="midiInputSelect" disabled><option value="">— none —</option></select>
        </div>
        <button id="connectBtn" title="Refresh MIDI" aria-label="Refresh MIDI">🔄</button>
      </div>
      <div id="midi-status-row">
        <span id="statusBadgeOut" class="status-badge" title="Output off" aria-label="Output off">○</span>
        <span id="statusBadgeIn" class="status-badge" title="Input off" aria-label="Input off">○</span>
        <span id="transportStatus" class="status-badge" title="Stopped" aria-label="Stopped">⏹</span>
      </div>
    </div>

    <div id="patch-controls">
      <input type="file" id="syxFileInput" accept=".syx" />
      <span class="patch-status" id="bankInfo">no bank</span>
      <label>P</label>
      <select id="patchSelect" disabled><option value="">— load a bank —</option></select>
      <label>Dest</label>
      <input type="number" id="destProg" min="0" max="127" value="0" />
      <button id="sendSinglePatchBtn" disabled>Send P</button>
      <button id="sendFullBankBtn" disabled>Send Bank</button>
    </div>

    <div id="grid-tools">
      <label>BPM</label>
      <input type="number" id="bpmInput" min="20" max="300" value="120" />
      <button id="clearPatternBtn" class="danger">Reset</button>
    </div>
  </div>

  <!-- BOTTOM DOCK -->
  <div id="bottom-dock">
    <div id="piano-container">
      <div class="piano" id="pianoContainer"></div>
    </div>
    <div id="durationButtons"></div>
    <div id="composer-controls">
      <button id="playPatternBtn" class="primary">Play</button>
      <button id="cursorBackBtn">Back</button>
      <button id="cursorForwardBtn">Fwd</button>
      <button id="editModeBtn">Replace</button>
      <button id="restStepBtn">Clear</button>
      <button id="addStepBtn">Add</button>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ================================================================
      // 1. OUTRUN BACKGROUND (WebGL) – forward motion, mountains, fixed sun
      // ================================================================
      (function initBackground() {
        const canvas = document.getElementById('bg-canvas');

        // ---- Configurable background state ----
        // The landscape is driven by musical motion. Speed keeps the old
        // data-speed control working, while position/target let the sequencer
        // push the horizon by exact bar distances during editing.
        const BG_UNITS_PER_BAR = 1.5;
        const BG_CATCHUP_RATE = 14.0;
        const bgConfig = { speed: 0.0, position: 0.0, target: 0.0, visualTime: 0.0 };
        function readSpeedFromAttr() {
          const v = parseFloat(canvas.dataset.speed);
          bgConfig.speed = Number.isFinite(v) ? v : 0.0;
        }
        readSpeedFromAttr();
        const bgAttrObserver = new MutationObserver((mutations) => {
          for (const m of mutations) {
            if (m.type === 'attributes' && m.attributeName === 'data-speed') {
              readSpeedFromAttr();
            }
          }
        });
        bgAttrObserver.observe(canvas, { attributes: true, attributeFilter: ['data-speed'] });

        // Public helper — usable from anywhere, any time:
        //   window.setBackgroundSpeed(-4)   // run the scene in reverse
        //   window.setBackgroundSpeed(0)    // freeze forward motion
        window.setBackgroundSpeed = function(value) {
          canvas.dataset.speed = value; // triggers the observer above
        };
        window.setBackgroundBarsPerSecond = function(barsPerSecond) {
          const v = parseFloat(barsPerSecond);
          bgConfig.speed = Number.isFinite(v) ? v * BG_UNITS_PER_BAR : 0.0;
          canvas.dataset.speed = String(bgConfig.speed);
        };
        window.pushBackgroundByBars = function(deltaBars) {
          const v = parseFloat(deltaBars);
          if (!Number.isFinite(v) || v === 0) return;
          bgConfig.target += v * BG_UNITS_PER_BAR;
        };
        window.setBackgroundBarPosition = function(barPosition, immediate=false) {
          const v = parseFloat(barPosition);
          if (!Number.isFinite(v)) return;
          bgConfig.target = v * BG_UNITS_PER_BAR;
          if (immediate) bgConfig.position = bgConfig.target;
        };
        window.freezeBackgroundMotion = function() {
          bgConfig.speed = 0.0;
          bgConfig.target = bgConfig.position;
          canvas.dataset.speed = '0';
        };

        const gl = canvas.getContext('webgl2', { alpha: false, antialias: true });
        if (!gl) {
          const ctx = canvas.getContext('2d');
          let w, h;
          function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
          }
          window.addEventListener('resize', resize);
          resize();
          function drawFallback() {
            const grad = ctx.createRadialGradient(w*0.5, h*0.5, 0, w*0.5, h*0.5, Math.max(w,h)*0.7);
            grad.addColorStop(0, '#1a0a2e');
            grad.addColorStop(0.5, '#2a1a4e');
            grad.addColorStop(1, '#0a0512');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            requestAnimationFrame(drawFallback);
          }
          drawFallback();
          return;
        }

        const vsSource = `#version 300 es
          in vec2 a_position;
          void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
          }
        `;

        const fsSource = `#version 300 es
          precision highp float;
          uniform vec2  u_resolution;
          uniform float u_time;
          uniform float u_motion;  // musical forward-motion position
          out vec4 outColor;

          // Ported from a Shadertoy-style raymarched retro sun/grid shader.
          // The original's backbuffer/motion-blur sampling was dead code
          // (computed but never actually blended into the output), so it's
          // dropped here — this is a single-pass port, no feedback texture.

          #define flickerFreq 1400.0
          #define flickerSpeed 30.0
          #define flickerIntensity 0.1

          #define iters 70
          #define minDst 0.001
          #define lineWidth 0.2
          #define lineCountX 35.0
          #define lineCountY (50.0/3.0)

          #define gridColor vec3(0.2, 0.05, 1.0)

          float hash(vec2 seed) {
            return fract(sin(dot(seed, vec2(12.9898, 4.1414))) * 43758.5453);
          }

          float getHeight(vec2 uv) {
            float time = u_time;
            uv += 0.5;
            uv.y -= u_motion;
            float y1 = floor(uv.y);
            float y2 = floor(uv.y + 1.0);
            float x1 = floor(uv.x);
            float x2 = floor(uv.x + 1.0);
            float iX1 = mix(hash(vec2(x1, y1)), hash(vec2(x2, y1)), fract(uv.x));
            float iX2 = mix(hash(vec2(x1, y2)), hash(vec2(x2, y2)), fract(uv.x));
            return mix(iX1, iX2, fract(uv.y));
          }

          float getDistance(vec3 p) {
            return p.z - (1.0 - cos(p.x * 15.0)) * 0.03 * getHeight(vec2(p.x * lineCountX, p.y * lineCountY));
          }

          float getGridColor(vec2 uv) {
            float time = u_time;
            float zoom = 1.0;
            float col = 0.0;
            vec3 cam = vec3(0.0, 1.0, 0.1);
            vec3 lookat = vec3(0.0);
            vec3 fwd = normalize(lookat - cam);
            vec3 up = normalize(cross(fwd, vec3(1.0, 0.0, 0.0)));
            vec3 right = cross(up, fwd);
            vec3 c = cam + fwd * zoom;
            vec3 i = c + right * uv.x + up * uv.y;
            vec3 ray = normalize(i - cam);

            float distSur = 0.0;
            float distOrigin = 0.0;
            vec3 p = cam;
            for (int k = 0; k < iters; k++) {
              distSur = getDistance(p);
              if (distOrigin > 2.0) break;
              if (distSur < minDst) {
                float lineW = lineWidth * distOrigin;
                float xLines = smoothstep(lineW, 0.0, abs(fract(p.x * lineCountX) - 0.5));
                float yLines = smoothstep(lineW * 2.0, 0.0, abs(fract(p.y * lineCountY - u_motion) - 0.5));
                col += max(xLines, yLines);
                break;
              }
              p += ray * distSur;
              distOrigin += distSur;
            }
            return max(0.0, col - (distOrigin * 0.8));
          }

          void main() {
            float time = u_time;
            vec2 R = u_resolution;
            float sunHeight = sin(time * 0.1) * 0.1 + 0.1;

            // gl_FragCoord.y is 0 at the bottom in WebGL (same as Shadertoy),
            // so no flip is needed here — the grid sits low, the sun sits high.
            vec2 uv = (gl_FragCoord.xy - 0.5 * R) / R.y + 0.5;

            uv.y -= sunHeight;

            float dist = 2.5 * length(uv - vec2(0.5, 0.5));
            float divisions = 50.0;

            float pattern = (sin(uv.y * divisions * 10.0 - time * 2.0) * 1.2 + uv.y * 8.3) * uv.y - 1.5 +
              sin(uv.x * 20.0 + time * 5.0) * 0.01;
            float sunOutline = smoothstep(0.0, -0.0315, max(dist - 0.315, -pattern));

            vec3 col = sunOutline * mix(vec3(4.0, 0.0, 0.2), vec3(1.0, 1.1, 0.0), uv.y);

            float glow = max(0.0, 1.0 - dist * 1.25);
            glow = min(glow * glow * glow, 0.325);
            col += glow * vec3(1.5, 0.3, 1.2) * 1.1;

            uv -= 0.5;
            uv.y += sunHeight;

            uv.y += 0.18;
            if (uv.y < 0.1) {
              col += getGridColor(uv) * 4.0 * gridColor;
            }

            vec4 fragColor = (1.3 + sin(time * flickerSpeed + uv.y * flickerFreq) * flickerIntensity) * vec4(col, 1.0);
            float scanline = smoothstep(1.0 - 0.2 / flickerFreq, 1.0, sin(time * flickerSpeed * 0.1 + uv.y * 4.0));
            fragColor *= scanline * 0.2 + 1.0;

            outColor = clamp(fragColor, 0.0, 1.0);
          }
        `;

        function compileShader(src, type) {
          const sh = gl.createShader(type);
          gl.shaderSource(sh, src);
          gl.compileShader(sh);
          if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
            console.error('Shader compile error:', gl.getShaderInfoLog(sh));
            gl.deleteShader(sh);
            return null;
          }
          return sh;
        }

        const vs = compileShader(vsSource, gl.VERTEX_SHADER);
        const fs = compileShader(fsSource, gl.FRAGMENT_SHADER);
        if (!vs || !fs) {
          const ctx = canvas.getContext('2d');
          let w, h;
          function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
          }
          window.addEventListener('resize', resize);
          resize();
          function drawGradient() {
            const grad = ctx.createRadialGradient(w*0.5, h*0.5, 0, w*0.5, h*0.5, Math.max(w,h)*0.7);
            grad.addColorStop(0, '#1a0a2e');
            grad.addColorStop(0.5, '#2a1a4e');
            grad.addColorStop(1, '#0a0512');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            requestAnimationFrame(drawGradient);
          }
          drawGradient();
          return;
        }

        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
          const ctx = canvas.getContext('2d');
          let w, h;
          function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
          }
          window.addEventListener('resize', resize);
          resize();
          function drawGradient() {
            const grad = ctx.createRadialGradient(w*0.5, h*0.5, 0, w*0.5, h*0.5, Math.max(w,h)*0.7);
            grad.addColorStop(0, '#1a0a2e');
            grad.addColorStop(0.5, '#2a1a4e');
            grad.addColorStop(1, '#0a0512');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            requestAnimationFrame(drawGradient);
          }
          drawGradient();
          return;
        }

        const posBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        const posLoc = gl.getAttribLocation(prog, 'a_position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

        const resLoc = gl.getUniformLocation(prog, 'u_resolution');
        const timeLoc = gl.getUniformLocation(prog, 'u_time');
        const motionLoc = gl.getUniformLocation(prog, 'u_motion');

        function resize() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          canvas.width = w;
          canvas.height = h;
          gl.viewport(0, 0, w, h);
        }
        window.addEventListener('resize', resize);
        resize();

        let lastRenderTime = performance.now();
        function render() {
          const now = performance.now();
          const dt = Math.min(0.05, Math.max(0, (now - lastRenderTime) / 1000));
          lastRenderTime = now;
          const wasMoving = Math.abs(bgConfig.speed) > 0.0001 || Math.abs(bgConfig.target - bgConfig.position) > 0.0001;
          if (wasMoving) bgConfig.visualTime += dt;
          bgConfig.target += bgConfig.speed * dt;
          const catchup = 1.0 - Math.exp(-BG_CATCHUP_RATE * dt);
          bgConfig.position += (bgConfig.target - bgConfig.position) * catchup;
          if (Math.abs(bgConfig.target - bgConfig.position) < 0.0001) bgConfig.position = bgConfig.target;
          gl.useProgram(prog);
          gl.uniform2f(resLoc, canvas.width, canvas.height);
          gl.uniform1f(timeLoc, bgConfig.visualTime);
          gl.uniform1f(motionLoc, bgConfig.position);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          requestAnimationFrame(render);
        }
        render();
      })();


      // ================================================================
      // 2. MIDI / PATCH MANAGER
      // ================================================================
      const FM1_OPERATOR_COUNT = 6;
      const FM1_OPERATOR_PARAMETER_COUNT = 21;
      const FM1_VOICE_NAME_LENGTH = 10;
      const FM1_VOICE_NAME_START = 118;

      const DX7_BANK_VOICE_COUNT = 32;
      const DX7_PACKED_VOICE_SIZE = 128;
      const DX7_BANK_DATA_SIZE = DX7_BANK_VOICE_COUNT * DX7_PACKED_VOICE_SIZE;
      const DX7_BANK_FILE_SIZE = DX7_BANK_DATA_SIZE + 8;

      const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

      function getNoteName(note) {
        const octave = Math.floor(note / 12) - 1;
        const noteIndex = ((note % 12) + 12) % 12;
        return NOTE_NAMES[noteIndex] + octave;
      }

      const outputSelect = document.getElementById('midiOutputSelect');
      const inputSelect = document.getElementById('midiInputSelect');
      const connectBtn = document.getElementById('connectBtn');
      const statusBadgeOut = document.getElementById('statusBadgeOut');
      const statusBadgeIn = document.getElementById('statusBadgeIn');
      const topHeaderEl = document.getElementById('top-header');
      const pianoContainer = document.getElementById('pianoContainer');
      const pianoScrollEl = document.getElementById('piano-container');
      const bottomDockEl = document.getElementById('bottom-dock');
      const logArea = document.getElementById('logArea');
      const clearLogBtn = document.getElementById('clearLogBtn');
      const showRawCheck = document.getElementById('showRawCheck');
      const syxFileInput = document.getElementById('syxFileInput');
      const patchSelect = document.getElementById('patchSelect');
      const destProg = document.getElementById('destProg');
      const sendSinglePatchBtn = document.getElementById('sendSinglePatchBtn');
      const sendFullBankBtn = document.getElementById('sendFullBankBtn');
      const bankInfo = document.getElementById('bankInfo');

      let midiAccess = null, selectedOutput = null, selectedInput = null;
      let activeNotes = new Set(), scheduledTimeouts = [];
      let loadedPatches = [];
      let fullBankData = null;

      const PIANO_NOTE_START = 17;  // F0
      const PIANO_NOTE_END = 115;   // G8

      const KEYBOARD_MAP = {
        'z': 60, 's': 61, 'x': 62, 'd': 63, 'c': 64,
        'v': 65, 'g': 66, 'b': 67, 'h': 68, 'n': 69,
        'j': 70, 'm': 71
      };

      function sendMidi(status, data1, data2) {
        if (!selectedOutput) return false;
        try { if (data2 === undefined) selectedOutput.send([status, data1]); else selectedOutput.send([status, data1, data2]); return true; } catch(e) { console.warn('MIDI send error:', e); return false; }
      }
      function logKeyEvent(direction, note, velocity, source) {
        console.log(`[FM-1 Seq] ${direction} ${getNoteName(note)} (${note}) vel ${velocity} via ${source}`);
      }
      function noteOn(note, velocity=105, source='manual') {
        if (activeNotes.has(note)) return;
        if (typeof captureComposerNoteOn === 'function') captureComposerNoteOn(note);
        logKeyEvent('key down', note, velocity, source);
        activeNotes.add(note); sendMidi(0x90, note, velocity);
        if (typeof updateComposerChordCapture === 'function') updateComposerChordCapture();
        const el = document.querySelector(`.key[data-note="${note}"]`); if (el) el.classList.add('active');
      }
      function noteOff(note, source='manual') {
        if (!activeNotes.has(note)) return;
        logKeyEvent('key up', note, 0, source);
        activeNotes.delete(note); sendMidi(0x80, note, 0);
        // Key-up releases sound/highlight only; the pending cursor chord stays until Add, Clear, or a new gesture.
        if (typeof updateComposerChordCapture === 'function') updateComposerChordCapture();
        if (activeNotes.size === 0 && typeof scheduleAutoAddCommit === 'function') scheduleAutoAddCommit();
        const el = document.querySelector(`.key[data-note="${note}"]`); if (el) el.classList.remove('active');
      }
      function allNotesOff() {
        for (const note of activeNotes) { logKeyEvent('key up', note, 0, 'all-off'); sendMidi(0x80, note, 0); const el = document.querySelector(`.key[data-note="${note}"]`); if (el) el.classList.remove('active'); }
        activeNotes.clear(); for (const t of scheduledTimeouts) clearTimeout(t); scheduledTimeouts = [];
      }

      function sendSysEx(data, callback) {
        if (!selectedOutput) {
          alert('No MIDI output connected.');
          if (callback) callback();
          return;
        }
        try {
          selectedOutput.send(data);
          if (callback) callback();
        } catch (e) {
          console.error('SysEx send error:', e);
          alert('Error sending SysEx: ' + e.message);
          if (callback) callback();
        }
      }

      function unpackDx7Voice(packed) {
        const unpacked = [];
        for (let operator = 0; operator < FM1_OPERATOR_COUNT; operator += 1) {
          const offset = operator * 17;
          for (let i = 0; i < 11; i += 1) {
            unpacked.push(packed[offset + i]);
          }
          unpacked.push(packed[offset + 11] & 0x03);
          unpacked.push((packed[offset + 11] >> 2) & 0x03);
          unpacked.push(packed[offset + 12] & 0x07);
          unpacked.push(packed[offset + 13] & 0x03);
          unpacked.push((packed[offset + 13] >> 2) & 0x07);
          unpacked.push(packed[offset + 14]);
          unpacked.push(packed[offset + 15] & 0x01);
          unpacked.push((packed[offset + 15] >> 1) & 0x1f);
          unpacked.push(packed[offset + 16]);
          unpacked.push((packed[offset + 12] >> 3) & 0x0f);
        }
        for (let i = 102; i < 110; i += 1) {
          unpacked.push(packed[i]);
        }
        unpacked.push(packed[110] & 0x1f);
        unpacked.push(packed[111] & 0x07);
        unpacked.push((packed[111] >> 3) & 0x01);
        for (let i = 112; i < 116; i += 1) {
          unpacked.push(packed[i]);
        }
        unpacked.push(packed[116] & 0x01);
        unpacked.push((packed[116] >> 1) & 0x07);
        unpacked.push((packed[116] >> 4) & 0x07);
        for (let i = 117; i < 128; i += 1) {
          unpacked.push(packed[i]);
        }
        return Uint8Array.from(unpacked);
      }

      function makeDx7SingleVoicePayload(packedVoice, channel) {
        if (packedVoice.length !== DX7_PACKED_VOICE_SIZE) {
          throw new Error(`Expected ${DX7_PACKED_VOICE_SIZE} bytes, received ${packedVoice.length}.`);
        }
        const data = unpackDx7Voice(packedVoice);
        const checksum = (128 - (data.reduce((sum, byte) => sum + byte, 0) & 0x7f)) & 0x7f;
        return Uint8Array.from([(channel - 1) & 0x0f, 0x00, 0x01, 0x1b, ...data, checksum]);
      }

      function decodeVoiceName(data) {
        let name = '';
        for (let i = 0; i < FM1_VOICE_NAME_LENGTH; i += 1) {
          const code = data[FM1_VOICE_NAME_START + i];
          if (code >= 0x20 && code <= 0x7e) {
            name += String.fromCharCode(code);
          } else {
            name += ' ';
          }
        }
        return name.trim() || 'UNTITLED';
      }

      function parseDx7Bank(file) {
        const bytes = new Uint8Array(file);
        if (bytes.length !== DX7_BANK_FILE_SIZE) {
          throw new Error(`Expected 4104-byte DX7 bank; received ${bytes.length} bytes.`);
        }
        if (bytes[0] !== 0xf0 || bytes[1] !== 0x43 || bytes[3] !== 0x09 ||
            bytes[4] !== 0x20 || bytes[5] !== 0x00 || bytes.at(-1) !== 0xf7) {
          throw new Error('Not a Yamaha DX7 32-voice bulk SysEx bank.');
        }
        const voiceData = bytes.slice(6, 6 + DX7_BANK_DATA_SIZE);
        const checksum = (128 - (voiceData.reduce((sum, byte) => sum + byte, 0) & 0x7f)) & 0x7f;
        if (checksum !== bytes.at(-2)) {
          throw new Error('DX7 bank checksum invalid.');
        }
        const voices = [];
        for (let i = 0; i < DX7_BANK_VOICE_COUNT; i += 1) {
          const data = voiceData.slice(i * DX7_PACKED_VOICE_SIZE, (i + 1) * DX7_PACKED_VOICE_SIZE);
          const name = decodeVoiceName(data);
          voices.push({ data, name });
        }
        return voices;
      }

      syxFileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const buffer = e.target.result;
            const voices = parseDx7Bank(buffer);
            loadedPatches = voices;
            fullBankData = new Uint8Array(buffer);

            patchSelect.innerHTML = '';
            if (loadedPatches.length === 0) {
              patchSelect.innerHTML = '<option value="">— no patches —</option>';
              patchSelect.disabled = true;
              bankInfo.textContent = '0p';
              sendSinglePatchBtn.disabled = true;
              sendFullBankBtn.disabled = true;
              return;
            }
            patchSelect.disabled = false;
            loadedPatches.forEach((p, idx) => {
              const opt = document.createElement('option');
              opt.value = idx;
              opt.textContent = `${idx+1}: ${p.name}`;
              patchSelect.appendChild(opt);
            });
            patchSelect.value = 0;
            bankInfo.textContent = `${loadedPatches.length}p`;
            sendSinglePatchBtn.disabled = !selectedOutput;
            sendFullBankBtn.disabled = !selectedOutput;
            const ts = new Date().toLocaleTimeString();
            logArea.value += `[${ts}] ✅ Loaded .syx file: ${loadedPatches.length} patches\n`;
            logArea.scrollTop = logArea.scrollHeight;
          } catch (err) {
            alert('Error parsing .syx file: ' + err.message);
            console.error(err);
          }
        };
        reader.readAsArrayBuffer(file);
      });

      function sendSinglePatch() {
        if (!selectedOutput) { alert('Connect to a MIDI output first.'); return; }
        const idx = parseInt(patchSelect.value, 10);
        if (isNaN(idx) || idx < 0 || idx >= loadedPatches.length) {
          alert('Please select a patch.');
          return;
        }
        const dest = parseInt(destProg.value, 10);
        if (isNaN(dest) || dest < 0 || dest > 127) {
          alert('Destination program must be between 0 and 127.');
          return;
        }

        sendSinglePatchBtn.disabled = true;
        sendSinglePatchBtn.textContent = '⏳ Sending...';

        if (selectedOutput) {
          sendMidi(0xC0, dest);
        }

        setTimeout(() => {
          const channel = 1;
          const packedVoice = loadedPatches[idx].data;
          try {
            const payload = makeDx7SingleVoicePayload(packedVoice, channel);
            const syx = new Uint8Array(2 + payload.length + 1);
            syx[0] = 0xF0;
            syx[1] = 0x43;
            syx.set(payload, 2);
            syx[2 + payload.length] = 0xF7;

            if (showRawCheck.checked) {
              const hex = Array.from(syx).map(b => '0x' + b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
              logArea.value += `[${new Date().toLocaleTimeString()}] Sending SysEx: ${hex}\n`;
            }

            sendSysEx(syx, () => {
              sendSinglePatchBtn.disabled = (loadedPatches.length===0 || !selectedOutput);
              sendSinglePatchBtn.textContent = 'Send P';
              const ts = new Date().toLocaleTimeString();
              logArea.value += `[${ts}] ✅ Patch "${loadedPatches[idx].name}" sent to slot ${dest}\n`;
              logArea.scrollTop = logArea.scrollHeight;
            });
          } catch (e) {
            console.error('Error building SysEx:', e);
            alert('Error: ' + e.message);
            sendSinglePatchBtn.disabled = false;
            sendSinglePatchBtn.textContent = 'Send P';
          }
        }, 50);
      }

      function sendFullBank() {
        if (!selectedOutput) { alert('Connect to a MIDI output first.'); return; }
        if (!fullBankData) { alert('No bank data loaded.'); return; }
        sendFullBankBtn.disabled = true;
        sendFullBankBtn.textContent = '⏳ Sending...';
        sendSysEx(fullBankData, () => {
          sendFullBankBtn.disabled = !selectedOutput;
          sendFullBankBtn.textContent = 'Send Bank';
          const ts = new Date().toLocaleTimeString();
          logArea.value += `[${ts}] ✅ Full bank sent to FM-1\n`;
          logArea.scrollTop = logArea.scrollHeight;
        });
      }

      sendSinglePatchBtn.addEventListener('click', sendSinglePatch);
      sendFullBankBtn.addEventListener('click', sendFullBank);

      function midiMessageToString(data, showRaw) {
        if (!data || data.length===0) return '';
        const rawHex = Array.from(data).map(b=>'0x'+b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
        const status = data[0]; const channel = (status&0x0F)+1; const command = status&0xF0;
        let desc='';
        if (status===0xF0) desc=`SysEx (${data.length} bytes)`;
        else if (status===0xF7) desc='SysEx End';
        else if (status>=0xF8) { const rt={0xF8:'Timing Clock',0xFA:'Start',0xFB:'Continue',0xFC:'Stop',0xFE:'Active Sensing',0xFF:'System Reset'}; desc=`Realtime: ${rt[status]||'0x'+status.toString(16)}`; }
        else {
          switch(command) {
            case 0x80: {
              const note=data[1], vel=data[2]||0;
              const name = getNoteName(note);
              desc=`Ch${channel} Note Off : ${name} (${note}) vel=${vel}`;
              break;
            }
            case 0x90: {
              const note=data[1], vel=data[2]||0;
              const name = getNoteName(note);
              desc=`Ch${channel} Note On  : ${name} (${note}) vel=${vel}`;
              break;
            }
            case 0xA0: {
              const note=data[1], pressure=data[2]||0;
              const name = getNoteName(note);
              desc=`Ch${channel} PolyPressure: ${name} (${note}) pressure=${pressure}`;
              break;
            }
            case 0xB0: {
              const cc=data[1], val=data[2];
              const ccName=cc===10?'Pan':cc===1?'Modulation':cc===7?'Volume':cc===11?'Expression':cc===64?'Sustain':cc===91?'Reverb':cc===93?'Chorus':`CC${cc}`;
              desc=`Ch${channel} Control  : ${ccName} = ${val}`;
              break;
            }
            case 0xC0: {
              const prog=data[1];
              desc=`Ch${channel} Program   : ${prog}`;
              break;
            }
            case 0xD0: {
              const pressure=data[1];
              desc=`Ch${channel} ChannelPressure: ${pressure}`;
              break;
            }
            case 0xE0: {
              const lsb=data[1], msb=data[2];
              const val=(msb<<7)|lsb;
              desc=`Ch${channel} PitchBend : ${val}`;
              break;
            }
            default: desc=`Ch${channel} Unknown   : ${rawHex}`;
          }
        }
        return showRaw ? `[${rawHex}] ${desc}` : desc;
      }

      function appendLog(data, showRaw) {
        const ts = new Date().toLocaleTimeString();
        const msg = midiMessageToString(data, showRaw);
        if (!msg) return;
        logArea.value += `[${ts}] ${msg}\n`;
        logArea.scrollTop = logArea.scrollHeight;
        const lines = logArea.value.split('\n');
        if (lines.length > 500) logArea.value = lines.slice(-400).join('\n');
      }

      function attachInputListener(input) {
        if (!input) return;
        input.onmidimessage = (event) => {
          appendLog(event.data, showRawCheck.checked);
          const data = event.data;
          if (!data || data.length < 2) return;
          const command = data[0] & 0xF0;
          const note = data[1];
          const velocity = data[2] || 0;
          // Route incoming Note On/Off through the same noteOn/noteOff path
          // the on-screen keyboard already uses, so activeNotes (and the
          // key highlight, and the composer/playback logic) see it too.
          if (command === 0x90 && velocity > 0) {
            noteOn(note, velocity, 'midi-in');
          } else if (command === 0x80 || (command === 0x90 && velocity === 0)) {
            noteOff(note, 'midi-in');
          }
        };
      }

      // ----- Build Piano (F0 to G8) -----
      function buildPiano() {
        pianoContainer.innerHTML = '';
        pianoContainer.style.position = 'relative';

        const WHITE_STEPS = [0, 2, 4, 5, 7, 9, 11];
        const pianoStyle = getComputedStyle(pianoContainer);
        const whiteWidth = parseFloat(pianoStyle.getPropertyValue('--white-key-width')) || 26;
        const blackWidth = parseFloat(pianoStyle.getPropertyValue('--black-key-width')) || 16;

        const whiteNotes = [];
        const blackNotes = [];
        for (let note = PIANO_NOTE_START; note <= PIANO_NOTE_END; note++) {
          const step = (note - 12) % 12;
          if (WHITE_STEPS.includes(step)) {
            whiteNotes.push(note);
          } else {
            blackNotes.push(note);
          }
        }

        whiteNotes.forEach((note) => {
          const key = document.createElement('div');
          key.className = 'key key-white';
          key.dataset.note = note;
          const label = document.createElement('span');
          label.className = 'key-label';
          label.textContent = getNoteName(note);
          key.appendChild(label);
          attachEvents(key, note);
          pianoContainer.appendChild(key);
        });

        // Black keys
        // Chromatic steps of WHITE keys that are immediately followed by a
        // black key (C, D, F, G, A) — there's no black key between E-F or B-C.
        // FIX: the previous code checked the white key's own step against a
        // map keyed by the BLACK key's steps ({1,3,6,8,10}), which never
        // matched since a white key's step is always 0,2,4,5,7,9,11 — so no
        // black key <div>s were ever created. This map fixes that.
        const whiteStepsWithBlackAfter = {0:true, 2:true, 5:true, 7:true, 9:true};
        let whiteIdx = 0;
        for (let i = 0; i < whiteNotes.length; i++) {
          const note = whiteNotes[i];
          const step = (note - 12) % 12;
          if (step in whiteStepsWithBlackAfter) {
            const blackNote = note + 1;
            if (blackNote >= PIANO_NOTE_START && blackNote <= PIANO_NOTE_END) {
              const key = document.createElement('div');
              key.className = 'key key-black';
              key.dataset.note = blackNote;
              const label = document.createElement('span');
              label.className = 'key-label';
              label.textContent = getNoteName(blackNote);
              key.appendChild(label);
              const leftPos = (whiteIdx + 1) * whiteWidth - blackWidth / 2;
              key.style.left = leftPos + 'px';
              key.style.width = blackWidth + 'px';
              attachEvents(key, blackNote);
              pianoContainer.appendChild(key);
            }
          }
          whiteIdx++;
        }

        if (typeof recomputeNoteColumns === 'function') recomputeNoteColumns();
        scheduleKeyboardCenter(true);
        console.log('[FM-1 Seq] keyboard layout', {
          left: Math.round(pianoContainer.getBoundingClientRect().left),
          width: Math.round(pianoContainer.offsetWidth),
          viewport: Math.round(pianoScrollEl.clientWidth),
          scrollLeft: Math.round(pianoScrollEl.scrollLeft),
        });
        console.assert(
          pianoContainer.querySelector(`.key[data-note="${PIANO_NOTE_START}"]`) &&
          pianoContainer.querySelector(`.key[data-note="${PIANO_NOTE_END}"]`),
          `Piano range should be ${getNoteName(PIANO_NOTE_START)}-${getNoteName(PIANO_NOTE_END)}`
        );
      }

      function attachEvents(key, note) {
        const start = (e) => { e.preventDefault(); noteOn(note, 105, 'screen'); };
        const end = (e) => { e.preventDefault(); noteOff(note, 'screen'); };
        key.addEventListener('mousedown', start);
        key.addEventListener('mouseup', end);
        key.addEventListener('mouseleave', end);
        key.addEventListener('touchstart', start, { passive: false });
        key.addEventListener('touchend', end, { passive: false });
        key.addEventListener('touchcancel', end, { passive: false });
      }

      function updateOutputs() {
        if (!midiAccess) { outputSelect.disabled=true; outputSelect.innerHTML='<option value="">— none —</option>'; return; }
        const outputs = Array.from(midiAccess.outputs.values());
        if (outputs.length===0) { outputSelect.disabled=true; outputSelect.innerHTML='<option value="">— none —</option>'; statusBadgeOut.textContent='∅'; statusBadgeOut.title='No MIDI output'; statusBadgeOut.setAttribute('aria-label','No MIDI output'); statusBadgeOut.className='status-badge'; return; }
        outputSelect.disabled=false;
        outputSelect.innerHTML = outputs.map(o=>`<option value="${o.id}">${o.name||'Unnamed'}</option>`).join('');
        outputSelect.value = outputs[0].id;
        selectedOutput = midiAccess.outputs.get(outputs[0].id)||null;
        updateUI();
      }
      function updateInputs() {
        if (!midiAccess) { inputSelect.disabled=true; inputSelect.innerHTML='<option value="">— none —</option>'; return; }
        const inputs = Array.from(midiAccess.inputs.values());
        if (inputs.length===0) { inputSelect.disabled=true; inputSelect.innerHTML='<option value="">— none —</option>'; statusBadgeIn.textContent='∅'; statusBadgeIn.title='No MIDI input'; statusBadgeIn.setAttribute('aria-label','No MIDI input'); statusBadgeIn.className='status-badge'; return; }
        inputSelect.disabled=false;
        inputSelect.innerHTML = inputs.map(inp=>`<option value="${inp.id}">${inp.name||'Unnamed'}</option>`).join('');
        inputSelect.value = inputs[0].id;
        selectedInput = midiAccess.inputs.get(inputs[0].id)||null;
        if (selectedInput) { attachInputListener(selectedInput); statusBadgeIn.textContent='👂'; statusBadgeIn.title='Listening'; statusBadgeIn.setAttribute('aria-label','Listening'); statusBadgeIn.className='status-badge online'; } else { statusBadgeIn.textContent='○'; statusBadgeIn.title='Input off'; statusBadgeIn.setAttribute('aria-label','Input off'); statusBadgeIn.className='status-badge'; }
        updateUI();
      }
      function connectMIDI() {
        if (navigator.requestMIDIAccess) {
          navigator.requestMIDIAccess({ sysex: true })
            .then((access) => {
              midiAccess = access;
              connectBtn.textContent = '🔄';
              updateOutputs(); updateInputs();
              midiAccess.onstatechange = () => { updateOutputs(); updateInputs(); };
            })
            .catch((err) => {
              console.error('Web MIDI error:', err);
              statusBadgeOut.textContent='⚠️'; statusBadgeOut.title='Output error'; statusBadgeOut.setAttribute('aria-label','Output error'); statusBadgeOut.className='status-badge';
              statusBadgeIn.textContent='⚠️'; statusBadgeIn.title='Input error'; statusBadgeIn.setAttribute('aria-label','Input error'); statusBadgeIn.className='status-badge';
              alert('Could not access MIDI. Please use Chrome/Edge and allow MIDI access.');
            });
        } else {
          alert('Web MIDI API is not supported in this browser. Please use Chrome, Edge, or Opera.');
        }
      }
      function updateUI() {
        const hasOutput = !!selectedOutput;
        const hasInput = !!selectedInput;
        sendSinglePatchBtn.disabled = (loadedPatches.length===0 || !hasOutput);
        sendFullBankBtn.disabled = (!fullBankData || !hasOutput);
        statusBadgeOut.textContent = hasOutput ? '🔌' : '○';
        statusBadgeOut.title = hasOutput ? 'Output connected' : 'Output off';
        statusBadgeOut.setAttribute('aria-label', statusBadgeOut.title);
        statusBadgeOut.className = hasOutput ? 'status-badge online' : 'status-badge';
        statusBadgeIn.textContent = hasInput ? '👂' : '○';
        statusBadgeIn.title = hasInput ? 'Listening' : 'Input off';
        statusBadgeIn.setAttribute('aria-label', statusBadgeIn.title);
        statusBadgeIn.className = hasInput ? 'status-badge online' : 'status-badge';
      }

      // ================================================================
      // 3. PATTERN COMPOSER / SEQUENCER
      // ================================================================
      // Step entry replaces the old swipe recorder: hold/play notes, choose a
      // duration, then commit a chord or a rest. The keyboard stays docked at
      // the bottom while playback drops notes into it from above.

      const trackerCanvas = document.getElementById('note-grid-canvas');
      const trackerCtx = trackerCanvas.getContext('2d');
      const durationFlashEl = document.getElementById('durationFlash');
      const transportStatusEl = document.getElementById('transportStatus');
      const bpmInput = document.getElementById('bpmInput');
      const durationButtonsEl = document.getElementById('durationButtons');
      const playPatternBtn = document.getElementById('playPatternBtn');
      const cursorBackBtn = document.getElementById('cursorBackBtn');
      const cursorForwardBtn = document.getElementById('cursorForwardBtn');
      const editModeBtn = document.getElementById('editModeBtn');
      const addStepBtn = document.getElementById('addStepBtn');
      const restStepBtn = document.getElementById('restStepBtn');
      const savePatternBtn = document.getElementById('savePatternBtn');
      const loadPatternBtn = document.getElementById('loadPatternBtn');
      const undoStepBtn = document.getElementById('undoStepBtn');
      const clearPatternBtn = document.getElementById('clearPatternBtn');
      const patternNameInput = document.getElementById('patternNameInput');
      const patternSelect = document.getElementById('patternSelect');

      const BAR_BEATS = 4; // assumes 4/4
      const PATTERN_STORAGE_KEY = 'fm1-step-patterns-v1';
      let bpm = parseFloat(bpmInput && bpmInput.value) || 120;
      if (bpmInput) {
        bpmInput.addEventListener('change', () => {
          const v = parseFloat(bpmInput.value);
          if (Number.isFinite(v) && v > 0) {
            bpm = v;
            if (transportMode === 'playing') setBackgroundPlaybackSpeed();
          }
        });
      }

      // "." entries are dotted (1.5x); "T" entries are triplets
      // (3 in the time of 2), expressed as fractions of a whole bar.
      const DURATIONS = [
        { label: '1/1.',   bars: 3 / 2   },
        { label: '1/1',    bars: 1       },
        { label: '1/2.',   bars: 3 / 4   },
        { label: '1/2',    bars: 1 / 2   },
        { label: '1/4.',   bars: 3 / 8   },
        { label: '1/2T',   bars: 1 / 3   },
        { label: '1/4',    bars: 1 / 4   },
        { label: '1/8.',   bars: 3 / 16  },
        { label: '1/4T',   bars: 1 / 6   },
        { label: '1/8',    bars: 1 / 8   },
        { label: '1/16.',  bars: 3 / 32  },
        { label: '1/8T',   bars: 1 / 12  },
        { label: '1/16',   bars: 1 / 16  },
        { label: '1/16T',  bars: 1 / 24  },
      ];
      const DURATION_EPSILON = 0.0001;
      const DEFAULT_DURATION_INDEX = 6; // 1/4
      let selectedDurationIndex = DEFAULT_DURATION_INDEX;

      let pxPerBar = 213;
      let pxPerBarUserSet = false;
      window.setBarHeight = function(px) {
        const v = parseFloat(px);
        if (Number.isFinite(v) && v > 10) { pxPerBar = v; pxPerBarUserSet = true; }
      };

      const noteColumnMap = new Map(); // note -> { x, width, black }  (x is canonical, i.e. as if scrollLeft===0)
      let totalPianoWidthPx = 0;
      let userPannedKeyboard = false;
      let programmaticKeyboardScroll = false;

      function recomputeNoteColumns() {
        noteColumnMap.clear();
        const scrollX = pianoScrollEl.scrollLeft;
        const originLeft = pianoScrollEl.getBoundingClientRect().left;
        let maxRight = 0;
        pianoContainer.querySelectorAll('.key').forEach((el) => {
          const note = parseInt(el.dataset.note, 10);
          const r = el.getBoundingClientRect();
          const x = (r.left - originLeft) + scrollX;
          const width = r.width;
          const black = el.classList.contains('key-black');
          noteColumnMap.set(note, { x, width, black });
          maxRight = Math.max(maxRight, x + width);
        });
        totalPianoWidthPx = maxRight;
      }

      function centerKeyboardIfOverflow(force=false) {
        if (!force && userPannedKeyboard) return;
        const overflow = pianoContainer.offsetWidth - pianoScrollEl.clientWidth;
        programmaticKeyboardScroll = true;
        pianoScrollEl.scrollLeft = overflow > 0 ? Math.round(overflow / 2) : 0;
        requestAnimationFrame(() => {
          recomputeNoteColumns();
          programmaticKeyboardScroll = false;
        });
      }

      function updateKeyboardWidthVar() {
        const keyboardWidth = `${Math.round(pianoContainer.offsetWidth)}px`;
        bottomDockEl.style.setProperty('--keyboard-width', keyboardWidth);
        if (topHeaderEl) topHeaderEl.style.setProperty('--keyboard-width', keyboardWidth);
      }

      function scheduleKeyboardCenter(force=false) {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            updateKeyboardWidthVar();
            centerKeyboardIfOverflow(force);
          });
        });
      }

      function resizeTrackerCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const h = Math.max(120, window.innerHeight);
        const w = window.innerWidth;
        trackerCanvas.style.width = w + 'px';
        trackerCanvas.style.height = h + 'px';
        trackerCanvas.width = Math.round(w * dpr);
        trackerCanvas.height = Math.round(h * dpr);
        trackerCanvas._cssW = w;
        trackerCanvas._cssH = h;
      }

      let transportMode = 'stopped'; // 'stopped' | 'playing'
      let steps = [];                // { durBar, label, notes:[...] }; empty notes = rest
      let sequence = [];             // derived note events: { startBar, durBar, notes, onFired, offFired }
      let recordCursorBar = 0;
      let cursorBar = 0;
      let playheadBar = 0;
      let playStartPerf = 0;
      let cursorNotes = [];
      let capturePeakNotes = [];
      let editMode = 'replace'; // 'replace' | 'add'
      let autoAddEnabled = false;
      let autoAddTimer = null;
      let addButtonLongPressTimer = null;
      let addButtonLongPressFired = false;
      let loopPlaybackEnabled = false;
      let playButtonLongPressTimer = null;
      let playButtonLongPressFired = false;

      function updateTransportStatus() {
        if (!transportStatusEl) return;
        if (transportMode === 'playing') {
          transportStatusEl.textContent = loopPlaybackEnabled ? '🔁' : '▶';
          transportStatusEl.title = loopPlaybackEnabled ? 'Looping' : 'Playing';
          transportStatusEl.setAttribute('aria-label', transportStatusEl.title);
          transportStatusEl.className = 'status-badge playing';
          if (playPatternBtn) playPatternBtn.textContent = loopPlaybackEnabled ? 'Stop Loop' : 'Stop';
        } else {
          transportStatusEl.textContent = '⏹';
          transportStatusEl.title = 'Stopped';
          transportStatusEl.setAttribute('aria-label', 'Stopped');
          transportStatusEl.className = 'status-badge';
          if (playPatternBtn) playPatternBtn.textContent = 'Play';
        }
      }

      let flashHideTimer = null;
      function flashDuration(label) {
        if (!durationFlashEl) return;
        durationFlashEl.textContent = label;
        durationFlashEl.classList.remove('show');
        void durationFlashEl.offsetWidth; // restart transition
        durationFlashEl.classList.add('show');
        clearTimeout(flashHideTimer);
        flashHideTimer = setTimeout(() => durationFlashEl.classList.remove('show'), 550);
      }

      function getSelectedDuration() {
        return DURATIONS[selectedDurationIndex] || DURATIONS[DEFAULT_DURATION_INDEX];
      }

      function getBarsPerSecond() {
        return bpm / (60 * BAR_BEATS);
      }

      function setBackgroundPlaybackSpeed() {
        if (window.setBackgroundBarsPerSecond) window.setBackgroundBarsPerSecond(getBarsPerSecond());
        else if (window.setBackgroundSpeed) window.setBackgroundSpeed(getBarsPerSecond() * 1.5);
      }

      function stopBackgroundMotion() {
        if (window.freezeBackgroundMotion) window.freezeBackgroundMotion();
        else if (window.setBackgroundBarsPerSecond) window.setBackgroundBarsPerSecond(0);
        else if (window.setBackgroundSpeed) window.setBackgroundSpeed(0);
      }

      function pushBackgroundForCursorMove(fromBar, toBar) {
        const deltaBars = toBar - fromBar;
        if (window.pushBackgroundByBars) window.pushBackgroundByBars(deltaBars);
      }

      function pushBackgroundToBar(barPosition, immediate=false) {
        if (window.setBackgroundBarPosition) window.setBackgroundBarPosition(barPosition, immediate);
      }

      function sameDuration(a, b) {
        return Math.abs(a - b) < DURATION_EPSILON;
      }

      function getDurationButtonGroups() {
        const groups = [];
        DURATIONS.forEach((dur, idx) => {
          let group = groups.find((entry) => sameDuration(entry.bars, dur.bars));
          if (!group) {
            group = { bars: dur.bars, labels: [], indexes: [] };
            groups.push(group);
          }
          group.labels.push(dur.label);
          group.indexes.push(idx);
        });
        return groups;
      }

      function sortedUniqueNotes(notes) {
        return Array.from(new Set(notes || [])).map((n) => parseInt(n, 10)).filter(Number.isFinite).sort((a, b) => a - b);
      }

      function notesEqual(a, b) {
        const aa = sortedUniqueNotes(a);
        const bb = sortedUniqueNotes(b);
        if (aa.length !== bb.length) return false;
        return aa.every((note, idx) => note === bb[idx]);
      }

      function unionNotes(a, b) {
        return sortedUniqueNotes([...(a || []), ...(b || [])]);
      }

      function withoutNotes(source, removed) {
        const removeSet = new Set(sortedUniqueNotes(removed));
        return sortedUniqueNotes(source).filter((note) => !removeSet.has(note));
      }

      function captureComposerNoteOn() {
        if (transportMode === 'playing') return;
        if (activeNotes.size === 0) {
          capturePeakNotes = editMode === 'add' ? cursorNotes.slice() : [];
          if (editMode !== 'add') cursorNotes = [];
        }
      }

      function updateComposerChordCapture() {
        if (transportMode === 'playing') return;
        const held = sortedUniqueNotes(activeNotes);
        const captured = editMode === 'add' ? unionNotes(cursorNotes, held) : held;
        if (captured.length > capturePeakNotes.length) {
          capturePeakNotes = captured;
          cursorNotes = captured;
          updateComposerUI();
        }
      }

      function scheduleAutoAddCommit() {
        if (!autoAddEnabled || transportMode === 'playing' || activeNotes.size > 0 || cursorNotes.length === 0) return;
        clearTimeout(autoAddTimer);
        autoAddTimer = setTimeout(() => {
          autoAddTimer = null;
          if (!autoAddEnabled || transportMode === 'playing' || activeNotes.size > 0 || cursorNotes.length === 0) return;
          commitCursorStep();
        }, 90);
      }

      function rebuildSequence() {
        sequence = [];
        let t = 0;
        let maxEnd = 0;
        steps.forEach((step) => {
          const hasStartBar = Number.isFinite(step.startBar);
          const startBar = hasStartBar ? Number(step.startBar) : t;
          const durBar = Number(step.durBar) || 0;
          const endBar = startBar + durBar;
          const notes = Array.isArray(step.notes) ? step.notes.slice().sort((a, b) => a - b) : [];
          if (notes.length > 0) {
            sequence.push({ startBar, durBar, notes, onFired: false, offFired: false });
          }
          t = hasStartBar ? Math.max(t, endBar) : t + durBar;
          maxEnd = Math.max(maxEnd, endBar);
        });
        sequence.sort((a, b) => a.startBar - b.startBar || a.durBar - b.durBar);
        recordCursorBar = maxEnd;
        cursorBar = Math.max(0, Math.min(cursorBar, recordCursorBar));
        updateComposerUI();
      }

      function getStepSegments() {
        let t = 0;
        return steps.map((step) => {
          const hasStartBar = Number.isFinite(step.startBar);
          const start = hasStartBar ? Number(step.startBar) : t;
          const durBar = Number(step.durBar) || 0;
          const segment = {
            start,
            end: start + durBar,
            notes: sortedUniqueNotes(step.notes),
          };
          t = hasStartBar ? Math.max(t, segment.end) : t + durBar;
          return segment;
        }).filter((segment) => segment.end > segment.start);
      }

      function notesAtTime(segments, time) {
        const segment = segments.find((s) => time >= s.start - 0.0001 && time < s.end - 0.0001);
        return segment ? segment.notes : [];
      }

      function rebuildStepsFromSegments(segments) {
        steps = segments
          .filter((segment) => segment.end > segment.start)
          .sort((a, b) => a.start - b.start || a.end - b.end)
          .map((segment) => ({
            startBar: segment.start,
            durBar: segment.end - segment.start,
            label: '',
            notes: sortedUniqueNotes(segment.notes),
          }))
          .map((step) => ({
            startBar: step.startBar,
            durBar: step.durBar,
            label: durationLabelForBars(step.durBar),
            notes: step.notes,
          }));
        rebuildSequence();
      }

      function durationLabelForBars(bars) {
        const match = DURATIONS.find((dur) => sameDuration(dur.bars, bars));
        return match ? match.label : formatBars(bars);
      }

      function editRange(startBar, durBar, notes) {
        const editStart = Math.max(0, startBar);
        const editEnd = Math.max(editStart, startBar + durBar);
        const normalized = sortedUniqueNotes(notes);
        const sourceSegments = getStepSegments();
        if (editMode !== 'add') {
          const editedSegments = [];
          sourceSegments.forEach((segment) => {
            if (segment.end <= editStart || segment.start >= editEnd) {
              editedSegments.push(segment);
              return;
            }
            if (segment.start < editStart) {
              editedSegments.push({ start: segment.start, end: editStart, notes: segment.notes });
            }
            if (segment.end > editEnd) {
              editedSegments.push({ start: editEnd, end: segment.end, notes: segment.notes });
            }
          });
          editedSegments.push({ start: editStart, end: editEnd, notes: normalized });
          editedSegments.sort((a, b) => a.start - b.start || a.end - b.end);
          rebuildStepsFromSegments(editedSegments);
          return;
        }
        if (normalized.length === 0) return;
        const editedSegments = [];
        sourceSegments.forEach((segment) => {
          if (segment.end <= editStart || segment.start >= editEnd) {
            editedSegments.push(segment);
            return;
          }
          const replacedNotes = segment.notes.filter((note) => normalized.includes(note));
          if (replacedNotes.length === 0) {
            editedSegments.push(segment);
            return;
          }

          const untouchedNotes = withoutNotes(segment.notes, replacedNotes);
          if (untouchedNotes.length > 0) {
            editedSegments.push({ start: segment.start, end: segment.end, notes: untouchedNotes });
          }
          if (segment.start < editStart) {
            editedSegments.push({ start: segment.start, end: editStart, notes: replacedNotes });
          }
          if (segment.end > editEnd) {
            editedSegments.push({ start: editEnd, end: segment.end, notes: replacedNotes });
          }
        });
        editedSegments.push({ start: editStart, end: editEnd, notes: normalized });
        editedSegments.sort((a, b) => a.start - b.start || a.end - b.end);
        rebuildStepsFromSegments(editedSegments);
      }

      function formatBars(value) {
        if (Math.abs(value - Math.round(value)) < 0.001) return String(Math.round(value));
        return value.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
      }

      function updateDurationButtons() {
        if (!durationButtonsEl) return;
        durationButtonsEl.querySelectorAll('button').forEach((btn) => {
          const indexes = (btn.dataset.durationIndexes || '').split(',').map((idx) => parseInt(idx, 10));
          btn.classList.toggle('active', indexes.includes(selectedDurationIndex));
        });
      }

      function updateSavedPatternSelect() {
        if (!patternSelect) return;
        const patterns = loadPatternMap();
        const names = Object.keys(patterns).sort((a, b) => a.localeCompare(b));
        const selected = patternSelect.value;
        patternSelect.innerHTML = '<option value="">Saved patterns</option>';
        names.forEach((name) => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          patternSelect.appendChild(opt);
        });
        if (patterns[selected]) patternSelect.value = selected;
      }

      function updateComposerUI() {
        updateDurationButtons();
        if (editModeBtn) {
          editModeBtn.textContent = editMode === 'add' ? 'Additive' : 'Replace';
          editModeBtn.classList.toggle('active', editMode === 'add');
        }
        if (addStepBtn) {
          addStepBtn.textContent = autoAddEnabled ? 'Auto Add' : 'Add';
          addStepBtn.classList.toggle('active', autoAddEnabled);
          addStepBtn.disabled = transportMode === 'playing';
        }
        if (restStepBtn) restStepBtn.disabled = transportMode === 'playing';
        if (cursorBackBtn) cursorBackBtn.disabled = cursorBar <= 0 || transportMode === 'playing';
        if (cursorForwardBtn) cursorForwardBtn.disabled = cursorBar >= recordCursorBar || transportMode === 'playing';
        if (undoStepBtn) undoStepBtn.disabled = steps.length === 0 || transportMode === 'playing';
        if (clearPatternBtn) clearPatternBtn.disabled = steps.length === 0 || transportMode === 'playing';
        if (savePatternBtn) savePatternBtn.disabled = steps.length === 0;
      }

      function commitStep(notes) {
        if (transportMode === 'playing') stopPlayback();
        const dur = getSelectedDuration();
        const normalized = sortedUniqueNotes(notes);
        const oldCursorBar = cursorBar;
        editRange(cursorBar, dur.bars, normalized);
        cursorBar = Math.max(0, cursorBar + dur.bars);
        pushBackgroundForCursorMove(oldCursorBar, cursorBar);
        rebuildSequence();
        flashDuration(normalized.length ? dur.label : `Rest ${dur.label}`);
      }

      function commitCursorStep() {
        clearTimeout(autoAddTimer);
        autoAddTimer = null;
        commitStep(cursorNotes);
        cursorNotes = [];
        capturePeakNotes = [];
        updateComposerUI();
      }

      function clearCursorNotes() {
        clearTimeout(autoAddTimer);
        autoAddTimer = null;
        cursorNotes = [];
        capturePeakNotes = [];
        updateComposerUI();
      }

      function clearSelectedRange() {
        if (transportMode === 'playing') return;
        clearTimeout(autoAddTimer);
        autoAddTimer = null;
        const dur = getSelectedDuration();
        const clearStart = cursorBar;
        const clearEnd = cursorBar + dur.bars;
        const sourceSegments = getStepSegments();
        const editedSegments = [];
        sourceSegments.forEach((segment) => {
          if (segment.end <= clearStart || segment.start >= clearEnd) {
            editedSegments.push(segment);
            return;
          }
          if (segment.start < clearStart) {
            editedSegments.push({ start: segment.start, end: clearStart, notes: segment.notes });
          }
          if (segment.end > clearEnd) {
            editedSegments.push({ start: clearEnd, end: segment.end, notes: segment.notes });
          }
        });
        rebuildStepsFromSegments(editedSegments);
        cursorNotes = [];
        capturePeakNotes = [];
        flashDuration(`Clear ${dur.label}`);
        updateComposerUI();
      }

      function undoStep() {
        if (transportMode === 'playing' || steps.length === 0) return;
        const oldCursorBar = cursorBar;
        steps.pop();
        rebuildSequence();
        cursorBar = recordCursorBar;
        pushBackgroundForCursorMove(oldCursorBar, cursorBar);
        updateComposerUI();
      }

      function clearPattern() {
        if (transportMode === 'playing') stopPlayback();
        steps = [];
        cursorBar = 0;
        rebuildSequence();
        pushBackgroundToBar(0);
      }

      function moveCursor(direction) {
        if (transportMode === 'playing') return;
        const dur = getSelectedDuration();
        const oldCursorBar = cursorBar;
        cursorBar = direction > 0
          ? Math.min(recordCursorBar, cursorBar + dur.bars)
          : Math.max(0, cursorBar - dur.bars);
        pushBackgroundForCursorMove(oldCursorBar, cursorBar);
        updateComposerUI();
      }

      function toggleEditMode() {
        editMode = editMode === 'add' ? 'replace' : 'add';
        updateComposerUI();
      }

      function toggleAutoAdd() {
        autoAddEnabled = !autoAddEnabled;
        flashDuration(autoAddEnabled ? 'Auto Add On' : 'Auto Add Off');
        updateComposerUI();
      }

      function handleAddButtonPointerDown(e) {
        if (transportMode === 'playing') return;
        addButtonLongPressFired = false;
        clearTimeout(addButtonLongPressTimer);
        addButtonLongPressTimer = setTimeout(() => {
          addButtonLongPressFired = true;
          toggleAutoAdd();
